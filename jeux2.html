<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>GameZone - Devine le nombre</title>

    <link rel="stylesheet" href="style.css">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f2f2f2;
            font-family: Arial, sans-serif;
        }

        /* =========================
           PAGE
        ========================= */

        .page-nombre {
            text-align: center;
            padding: 30px 15px;
        }

        .page-nombre h1 {
            color: #9b59b6;
            font-size: 45px;

            text-shadow:
                0 0 8px #c77dff,
                0 0 20px #9b59b6;
        }

        .page-nombre p {
            font-size: 20px;
        }


        /* =========================
           COMPTE
        ========================= */

        .compte {
            max-width: 500px;
            margin: 20px auto;

            background: white;

            border: 2px solid #9b59b6;

            border-radius: 15px;

            padding: 15px;

            box-shadow:
                0 5px 15px rgba(0,0,0,0.15);
        }

        .compte strong {
            color: #9b59b6;
        }

        #pseudoAffiche {
            color: #7d3c98;
            font-size: 20px;
        }


        /* =========================
           JEU
        ========================= */

        .zone-jeu {
            max-width: 600px;

            margin: 20px auto;

            background: white;

            border-radius: 20px;

            padding: 25px;

            box-shadow:
                0 5px 20px rgba(0,0,0,0.15);
        }


        /* =========================
           SCORE
        ========================= */

        .scores {
            display: flex;

            justify-content: center;

            gap: 30px;

            flex-wrap: wrap;

            margin: 20px 0;

            font-size: 20px;

            font-weight: bold;
        }

        #score {
            color: #9b59b6;
        }

        #meilleurScore {
            color: #e6a700;
        }


        /* =========================
           INPUT
        ========================= */

        #nombre {

            width: 120px;

            padding: 14px;

            font-size: 22px;

            text-align: center;

            border: 3px solid #9b59b6;

            border-radius: 10px;

            margin: 10px;

            outline: none;
        }

        #nombre:focus {
            border-color: #c77dff;

            box-shadow:
                0 0 10px rgba(155,89,182,0.4);
        }


        /* =========================
           BOUTONS
        ========================= */

        .bouton {

            background-color: #9b59b6;

            color: white;

            border: none;

            border-radius: 10px;

            padding: 13px 22px;

            font-size: 18px;

            cursor: pointer;

            margin: 5px;
        }

        .bouton:hover {

            background-color: #c77dff;

            transform: scale(1.05);
        }

        .bouton:active {

            transform: scale(0.95);
        }


        /* =========================
           MESSAGE
        ========================= */

        #message {

            margin-top: 25px;

            font-size: 22px;

            font-weight: bold;

            min-height: 35px;
        }


        /* =========================
           RETOUR
        ========================= */

        .retour-jeux {

            display: inline-block;

            margin-bottom: 20px;

            background-color: #333;

            color: white;

            padding: 10px 18px;

            border-radius: 10px;

            text-decoration: none;

            font-size: 16px;
        }

        .retour-jeux:hover {

            background-color: #555;
        }


        /* =========================
           CLASSEMENT
        ========================= */

        .classement {

            max-width: 650px;

            margin: 35px auto;

            background: white;

            border: 3px solid #9b59b6;

            border-radius: 20px;

            padding: 20px;

            box-shadow:
                0 5px 20px rgba(0,0,0,0.15);
        }

        .classement h2 {

            color: #9b59b6;

            margin-top: 0;
        }


        #tableauScores {

            width: 100%;

            border-collapse: collapse;

            margin-top: 15px;
        }


        #tableauScores th,
        #tableauScores td {

            padding: 12px;

            border-bottom:
                1px solid #ddd;

        }


        #tableauScores th {

            color: #9b59b6;

            font-size: 17px;
        }


        #tableauScores tr:nth-child(1) td {

            color: #d4a000;

            font-weight: bold;
        }


        #tableauScores tr:nth-child(2) td {

            color: #777;
        }


        #tableauScores tr:nth-child(3) td {

            color: #a05a20;
        }


        .statut {

            min-height: 25px;

            margin-top: 15px;

            color: #666;

            font-size: 15px;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            .page-nombre {

                padding: 20px 10px;
            }

            .page-nombre h1 {

                font-size: 32px;
            }

            .page-nombre p {

                font-size: 18px;
            }

            .zone-jeu {

                padding: 20px 10px;
            }

            .scores {

                gap: 15px;

                font-size: 17px;
            }

            #nombre {

                width: 100px;

                font-size: 20px;
            }

            .bouton {

                font-size: 17px;

                padding: 13px 18px;
            }

            .classement {

                width: 95%;

                padding: 12px;
            }

            #tableauScores th,
            #tableauScores td {

                padding: 8px 4px;

                font-size: 14px;
            }

        }

    </style>

</head>


<body class="page-jeu">


    <!-- =========================
         MENU
    ========================= -->

    <nav>

        <a href="index.html">
            🏠 Accueil
        </a>

        <a href="liste-jeux.html">
            🎮 Jeux
        </a>

    </nav>


    <main class="page-nombre">


        <h1>
            🎲 Devine le nombre
        </h1>


        <!-- =========================
             RETOUR
        ========================= -->

        <a
            href="liste-jeux.html"
            class="retour-jeux">

            ⬅️ Retour aux jeux

        </a>


        <!-- =========================
             COMPTE
        ========================= -->

        <div
            class="compte"
            id="zoneCompte">

            👤 Joueur :

            <strong
                id="pseudoAffiche">

                Chargement...

            </strong>

        </div>


        <!-- =========================
             ZONE DE JEU
        ========================= -->

        <div class="zone-jeu">


            <p>

                🤔 Je pense à un nombre entre
                <strong>1 et 5</strong>.

            </p>


            <p>

                🎯 Trouve le nombre pour gagner
                <strong>1 point</strong> !

            </p>


            <!-- =========================
                 SCORES
            ========================= -->

            <div class="scores">

                <div>

                    🎯 Score :
                    <span id="score">
                        0
                    </span>

                </div>


                <div>

                    🏆 Meilleur :
                    <span id="meilleurScore">
                        0
                    </span>

                </div>

            </div>


            <!-- =========================
                 INPUT
            ========================= -->

            <input
                type="number"
                id="nombre"
                min="1"
                max="5"
                placeholder="1-5"
                inputmode="numeric"
            >


            <br>


            <!-- =========================
                 VALIDER
            ========================= -->

            <button
                class="bouton"
                id="boutonValider"
                onclick="verifier()">

                Valider 🎯

            </button>


            <!-- =========================
                 NOUVELLE PARTIE
            ========================= -->

            <button
                class="bouton"
                onclick="nouvellePartie()">

                🔄 Nouvelle partie

            </button>


            <!-- =========================
                 MESSAGE
            ========================= -->

            <p id="message"></p>


        </div>


        <!-- =========================
             CLASSEMENT
        ========================= -->

        <section class="classement">


            <h2>

                🌍 🏆 TOP 10 MONDIAL
                <br>

                🎲 Devine le nombre

            </h2>


            <table id="tableauScores">


                <thead>

                    <tr>

                        <th>
                            #
                        </th>

                        <th>
                            👤 Pseudo
                        </th>

                        <th>
                            🎯 Score
                        </th>

                    </tr>

                </thead>


                <tbody id="listeScores">

                    <tr>

                        <td colspan="3">

                            Chargement...

                        </td>

                    </tr>

                </tbody>


            </table>


            <div
                class="statut"
                id="statutClassement">

                🌍 Chargement du classement...

            </div>


        </section>


    </main>


<script>


/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
    "https://pxgymcwpbesqyjochwgd.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_F0af00-z9ZDemm9ch1tIaA_wSNCZb9G";


/* =====================================================
   IDENTIFICATION DU JEU
===================================================== */

const JEU =
    "jeux2";


/* =====================================================
   ELEMENTS
===================================================== */

const pseudoAffiche =
    document.getElementById(
        "pseudoAffiche"
    );

const scoreElement =
    document.getElementById(
        "score"
    );

const meilleurScoreElement =
    document.getElementById(
        "meilleurScore"
    );

const nombreInput =
    document.getElementById(
        "nombre"
    );

const message =
    document.getElementById(
        "message"
    );

const listeScores =
    document.getElementById(
        "listeScores"
    );

const statutClassement =
    document.getElementById(
        "statutClassement"
    );


/* =====================================================
   PSEUDO
===================================================== */

let pseudo =
    localStorage.getItem(
        "gamezonePseudo"
    );


if (!pseudo) {

    pseudoAffiche.textContent =
        "Aucun pseudo";

    message.textContent =
        "⚠️ Crée d'abord ton compte depuis l'accueil.";

}


/* =====================================================
   SCORE LOCAL
===================================================== */

let score = 0;


/*
   Le meilleur score est propre
   à CE jeu.
*/

let meilleurScore =
    Number(
        localStorage.getItem(
            "meilleurScoreJeux2"
        )
    ) || 0;


meilleurScoreElement.textContent =
    meilleurScore;


/* =====================================================
   NOMBRE SECRET
===================================================== */

let nombreSecret =
    nouveauNombre();


function nouveauNombre() {

    return Math.floor(
        Math.random() * 5
    ) + 1;

}


/* =====================================================
   VERIFIER
===================================================== */

function verifier() {

    if (!pseudo) {

        message.textContent =
            "⚠️ Aucun pseudo enregistré.";

        return;

    }


    const choix =
        Number(
            nombreInput.value
        );


    /* Vérification */

    if (
        !Number.isInteger(choix) ||
        choix < 1 ||
        choix > 5
    ) {

        message.textContent =
            "⚠️ Entre un nombre entier entre 1 et 5.";

        return;

    }


    /* Bonne réponse */

    if (
        choix === nombreSecret
    ) {

        score++;


        scoreElement.textContent =
            score;


        message.textContent =
            "🎉 Bravo ! +1 point !";


        /*
           Nouveau meilleur score local
        */

        if (
            score > meilleurScore
        ) {

            meilleurScore =
                score;


            meilleurScoreElement.textContent =
                meilleurScore;


            localStorage.setItem(
                "meilleurScoreJeux2",
                meilleurScore
            );

        }


        /*
           On enregistre le meilleur
           score dans Supabase.
        */

        enregistrerMeilleurScore();


        /*
           Nouveau nombre
        */

        nombreSecret =
            nouveauNombre();

    }

    else {

        message.textContent =
            "❌ Raté ! Le nombre était "
            +
            nombreSecret
            +
            ".";

        /*
           On change le nombre après
           une mauvaise réponse également.
        */

        nombreSecret =
            nouveauNombre();

    }


    nombreInput.value =
        "";

    nombreInput.focus();

}


/* =====================================================
   NOUVELLE PARTIE
===================================================== */

function nouvellePartie() {

    score = 0;


    scoreElement.textContent =
        "0";


    nombreSecret =
        nouveauNombre();


    nombreInput.value =
        "";


    message.textContent =
        "🎲 Nouvelle partie !";


    nombreInput.focus();

}


/* =====================================================
   TOUCHE ENTREE
===================================================== */

nombreInput.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter"
        ) {

            verifier();

        }

    }
);


/* =====================================================
   ENREGISTRER LE MEILLEUR SCORE
===================================================== */

async function enregistrerMeilleurScore() {

    if (!pseudo) {

        return;

    }


    try {

        statutClassement.textContent =
            "⏳ Enregistrement du score...";


        /*
           Chercher uniquement le score
           du pseudo POUR LE JEU 2.
        */

        const recherche =
            await fetch(

                SUPABASE_URL +
                "/rest/v1/scores" +

                "?pseudo=eq." +
                encodeURIComponent(
                    pseudo
                ) +

                "&jeu=eq." +
                encodeURIComponent(
                    JEU
                ) +

                "&select=id,pseudo,score,jeu" +

                "&limit=1",

                {

                    method: "GET",

                    headers: {

                        "apikey":
                            SUPABASE_KEY,

                        "Authorization":
                            "Bearer " +
                            SUPABASE_KEY

                    }

                }

            );


        if (!recherche.ok) {

            const texte =
                await recherche.text();

            console.error(
                "Erreur recherche :",
                texte
            );

            throw new Error(
                "Recherche Supabase impossible."
            );

        }


        const anciensScores =
            await recherche.json();


        /* =========================================
           AUCUN SCORE EXISTANT
        ========================================= */

        if (
            anciensScores.length === 0
        ) {


            const insertion =
                await fetch(

                    SUPABASE_URL +
                    "/rest/v1/scores",

                    {

                        method: "POST",

                        headers: {

                            "apikey":
                                SUPABASE_KEY,

                            "Authorization":
                                "Bearer " +
                                SUPABASE_KEY,

                            "Content-Type":
                                "application/json",

                            "Prefer":
                                "return=minimal"

                        },

                        body:
                            JSON.stringify({

                                pseudo:
                                    pseudo,

                                score:
                                    meilleurScore,

                                jeu:
                                    JEU

                            })

                    }

                );


            if (!insertion.ok) {

                const texte =
                    await insertion.text();

                console.error(
                    "Erreur insertion :",
                    texte
                );

                throw new Error(
                    "Insertion Supabase impossible."
                );

            }


            statutClassement.textContent =
                "🏆 Ton score a été ajouté au classement.";

        }


        /* =========================================
           SCORE EXISTANT
        ========================================= */

        else {

            const ancienScore =
                Number(
                    anciensScores[0].score
                );


            /*
               UPDATE UNIQUEMENT
               SI NOUVEAU RECORD.
            */

            if (
                meilleurScore >
                ancienScore
            ) {


                const id =
                    anciensScores[0].id;


                const miseAJour =
                    await fetch(

                        SUPABASE_URL +
                        "/rest/v1/scores" +

                        "?id=eq." +
                        encodeURIComponent(
                            id
                        ),

                        {

                            method: "PATCH",

                            headers: {

                                "apikey":
                                    SUPABASE_KEY,

                                "Authorization":
                                    "Bearer " +
                                    SUPABASE_KEY,

                                "Content-Type":
                                    "application/json",

                                "Prefer":
                                    "return=minimal"

                            },

                            body:
                                JSON.stringify({

                                    score:
                                        meilleurScore

                                })

                        }

                    );


                if (!miseAJour.ok) {

                    const texte =
                        await miseAJour.text();

                    console.error(
                        "Erreur UPDATE :",
                        texte
                    );

                    throw new Error(
                        "UPDATE Supabase impossible."
                    );

                }


                statutClassement.textContent =
                    "🔥 Nouveau record enregistré !";

            }

            else {

                statutClassement.textContent =
                    "ℹ️ Ton meilleur score reste "
                    +
                    ancienScore
                    +
                    " points.";

            }

        }


        /*
           Recharger le classement
        */

        await chargerClassement();

    }

    catch (erreur) {

        console.error(
            erreur
        );


        statutClassement.textContent =
            "❌ Erreur lors de l'enregistrement.";

    }

}


/* =====================================================
   CHARGER TOP 10
===================================================== */

async function chargerClassement() {

    try {

        /*
           IMPORTANT :
           ON FILTRE SUR jeu = jeux2
        */

        const resultat =
            await fetch(

                SUPABASE_URL +
                "/rest/v1/scores" +

                "?select=pseudo,score,jeu" +

                "&jeu=eq." +
                encodeURIComponent(
                    JEU
                ) +

                "&order=score.desc" +

                "&limit=10",

                {

                    method: "GET",

                    headers: {

                        "apikey":
                            SUPABASE_KEY,

                        "Authorization":
                            "Bearer " +
                            SUPABASE_KEY

                    }

                }

            );


        if (!resultat.ok) {

            const texte =
                await resultat.text();

            console.error(
                "Erreur classement :",
                texte
            );

            throw new Error(
                "Classement inaccessible."
            );

        }


        const scores =
            await resultat.json();


        listeScores.innerHTML =
            "";


        /* =========================================
           AUCUN SCORE
        ========================================= */

        if (
            scores.length === 0
        ) {

            listeScores.innerHTML = `

                <tr>

                    <td colspan="3">

                        Aucun score pour
                        Devine le nombre.

                    </td>

                </tr>

            `;


            statutClassement.textContent =
                "🌍 Aucun score pour ce jeu.";

            return;

        }


        /* =========================================
           AFFICHER TOP 10
        ========================================= */

        scores.forEach(
            function(
                joueurScore,
                index
            ) {

                const ligne =
                    document.createElement(
                        "tr"
                    );


                ligne.innerHTML = `

                    <td>
                        ${index + 1}
                    </td>

                    <td>
                        ${echapperHTML(
                            joueurScore.pseudo
                        )}
                    </td>

                    <td>
                        ${Number(
                            joueurScore.score
                        )}
                    </td>

                `;


                listeScores.appendChild(
                    ligne
                );

            }
        );


        statutClassement.textContent =
            "🌍 Classement Devine le nombre actualisé.";

    }

    catch (erreur) {

        console.error(
            erreur
        );


        listeScores.innerHTML = `

            <tr>

                <td colspan="3">

                    ❌ Impossible de charger
                    le classement.

                </td>

            </tr>

        `;


        statutClassement.textContent =
            "❌ Erreur lors du chargement du classement.";

    }

}


/* =====================================================
   SECURITE
===================================================== */

function echapperHTML(
    texte
) {

    return String(
        texte
    )

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#039;"
    );

}


/* =====================================================
   DEMARRAGE
===================================================== */

chargerClassement();

</script>


</body>

</html>
