<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>GameZone - Devine le nombre</title>

    <link rel="stylesheet" href="style.css">

    

</head>


<body class="page-jeu">


    <!-- =========================
         MENU
    ========================= -->

    <nav>

        <a href="index.html">
            🏠 Accueil
        </a>

        <a href="liste-jeux.html">
            🎮 Jeux
        </a>

    </nav>


    <main class="page-nombre">


        <h1>
            🎲 Devine le nombre
        </h1>


        <!-- =========================
             RETOUR
        ========================= -->

        <a
            href="liste-jeux.html"
            class="retour-jeux">

            ⬅️ Retour aux jeux

        </a>


        <!-- =========================
             COMPTE
        ========================= -->

        <div
            class="compte"
            id="zoneCompte">

            👤 Joueur :

            <strong
                id="pseudoAffiche">

                Chargement...

            </strong>

        </div>


        <!-- =========================
             ZONE DE JEU
        ========================= -->

        <div class="zone-jeu">


            <p>

                🤔 Je pense à un nombre entre
                <strong>1 et 5</strong>.

            </p>


            <p>

                🎯 Trouve le nombre pour gagner
                <strong>1 point</strong> !

            </p>


            <!-- =========================
                 SCORES
            ========================= -->

            <div class="scores">

                <div>

                    🎯 Score :
                    <span id="score">
                        0
                    </span>

                </div>


                <div>

                    🏆 Meilleur :
                    <span id="meilleurScore">
                        0
                    </span>

                </div>

            </div>


            <!-- =========================
                 INPUT
            ========================= -->

            <input
                type="number"
                id="nombre"
                min="1"
                max="5"
                placeholder="1-5"
                inputmode="numeric"
            >


            <br>


            <!-- =========================
                 VALIDER
            ========================= -->

            <button
                class="bouton"
                id="boutonValider"
                onclick="verifier()">

                Valider 🎯

            </button>


            <!-- =========================
                 NOUVELLE PARTIE
            ========================= -->

            <button
                class="bouton"
                onclick="nouvellePartie()">

                🔄 Nouvelle partie

            </button>


            <!-- =========================
                 MESSAGE
            ========================= -->

            <p id="message"></p>


        </div>


        <!-- =========================
             CLASSEMENT
        ========================= -->

        <section class="classement">


            <h2>

                🌍 🏆 TOP 10 MONDIAL
                <br>

                🎲 Devine le nombre

            </h2>


            <table id="tableauScores">


                <thead>

                    <tr>

                        <th>
                            #
                        </th>

                        <th>
                            👤 Pseudo
                        </th>

                        <th>
                            🎯 Score
                        </th>

                    </tr>

                </thead>


                <tbody id="listeScores">

                    <tr>

                        <td colspan="3">

                            Chargement...

                        </td>

                    </tr>

                </tbody>


            </table>


            <div
                class="statut"
                id="statutClassement">

                🌍 Chargement du classement...

            </div>


        </section>


    </main>


<script>


/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
    "https://pxgymcwpbesqyjochwgd.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_F0af00-z9ZDemm9ch1tIaA_wSNCZb9G";


/* =====================================================
   IDENTIFICATION DU JEU
===================================================== */

const JEU =
    "jeux2";


/* =====================================================
   ELEMENTS
===================================================== */

const pseudoAffiche =
    document.getElementById(
        "pseudoAffiche"
    );

const scoreElement =
    document.getElementById(
        "score"
    );

const meilleurScoreElement =
    document.getElementById(
        "meilleurScore"
    );

const nombreInput =
    document.getElementById(
        "nombre"
    );

const message =
    document.getElementById(
        "message"
    );

const listeScores =
    document.getElementById(
        "listeScores"
    );

const statutClassement =
    document.getElementById(
        "statutClassement"
    );


/* =====================================================
   PSEUDO
===================================================== */

let pseudo =
    localStorage.getItem("pseudoGameZone");

if (pseudo) {

    pseudoAffiche.textContent = pseudo;

}
else {

    pseudoAffiche.textContent = "Aucun pseudo";

    message.textContent =
        "⚠️ Crée d'abord ton compte depuis l'accueil.";

}


/* =====================================================
   SCORE LOCAL
===================================================== */

let score = 0;


/*
   Le meilleur score est propre
   à CE jeu.
*/

let meilleurScore =
    Number(
        localStorage.getItem(
            "meilleurScoreJeux2"
        )
    ) || 0;


meilleurScoreElement.textContent =
    meilleurScore;


/* =====================================================
   NOMBRE SECRET
===================================================== */

let nombreSecret =
    nouveauNombre();


function nouveauNombre() {

    return Math.floor(
        Math.random() * 5
    ) + 1;

}


/* =====================================================
   VERIFIER
===================================================== */

function verifier() {

    if (!pseudo) {

        message.textContent =
            "⚠️ Aucun pseudo enregistré.";

        return;

    }


    const choix =
        Number(
            nombreInput.value
        );


    /* Vérification */

    if (
        !Number.isInteger(choix) ||
        choix < 1 ||
        choix > 5
    ) {

        message.textContent =
            "⚠️ Entre un nombre entier entre 1 et 5.";

        return;

    }


    /* Bonne réponse */

    if (
        choix === nombreSecret
    ) {

        score++;


        scoreElement.textContent =
            score;


        message.textContent =
            "🎉 Bravo ! +1 point !";


        /*
           Nouveau meilleur score local
        */

        if (
            score > meilleurScore
        ) {

            meilleurScore =
                score;


            meilleurScoreElement.textContent =
                meilleurScore;


            localStorage.setItem(
                "meilleurScoreJeux2",
                meilleurScore
            );

        }


        /*
           On enregistre le meilleur
           score dans Supabase.
        */

        enregistrerMeilleurScore();


        /*
           Nouveau nombre
        */

        nombreSecret =
            nouveauNombre();

    }

    else {

        message.textContent =
            "❌ Raté ! Le nombre était "
            +
            nombreSecret
            +
            ".";

        /*
           On change le nombre après
           une mauvaise réponse également.
        */

        nombreSecret =
            nouveauNombre();

    }


    nombreInput.value =
        "";

    nombreInput.focus();

}


/* =====================================================
   NOUVELLE PARTIE
===================================================== */

function nouvellePartie() {

    score = 0;


    scoreElement.textContent =
        "0";


    nombreSecret =
        nouveauNombre();


    nombreInput.value =
        "";


    message.textContent =
        "🎲 Nouvelle partie !";


    nombreInput.focus();

}


/* =====================================================
   TOUCHE ENTREE
===================================================== */

nombreInput.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter"
        ) {

            verifier();

        }

    }
);


/* =====================================================
   ENREGISTRER LE MEILLEUR SCORE
===================================================== */

async function enregistrerMeilleurScore() {

    if (!pseudo) {

        return;

    }


    try {

        statutClassement.textContent =
            "⏳ Enregistrement du score...";


        /*
           Chercher uniquement le score
           du pseudo POUR LE JEU 2.
        */

        const recherche =
            await fetch(

                SUPABASE_URL +
                "/rest/v1/scores" +

                "?pseudo=eq." +
                encodeURIComponent(
                    pseudo
                ) +

                "&jeu=eq." +
                encodeURIComponent(
                    JEU
                ) +

                "&select=id,pseudo,score,jeu" +

                "&limit=1",

                {

                    method: "GET",

                    headers: {

                        "apikey":
                            SUPABASE_KEY,

                        "Authorization":
                            "Bearer " +
                            SUPABASE_KEY

                    }

                }

            );


        if (!recherche.ok) {

            const texte =
                await recherche.text();

            console.error(
                "Erreur recherche :",
                texte
            );

            throw new Error(
                "Recherche Supabase impossible."
            );

        }


        const anciensScores =
            await recherche.json();


        /* =========================================
           AUCUN SCORE EXISTANT
        ========================================= */

        if (
            anciensScores.length === 0
        ) {


            const insertion =
                await fetch(

                    SUPABASE_URL +
                    "/rest/v1/scores",

                    {

                        method: "POST",

                        headers: {

                            "apikey":
                                SUPABASE_KEY,

                            "Authorization":
                                "Bearer " +
                                SUPABASE_KEY,

                            "Content-Type":
                                "application/json",

                            "Prefer":
                                "return=minimal"

                        },

                        body:
                            JSON.stringify({

                                pseudo:
                                    pseudo,

                                score:
                                    meilleurScore,

                                jeu:
                                    JEU

                            })

                    }

                );


            if (!insertion.ok) {

                const texte =
                    await insertion.text();

                console.error(
                    "Erreur insertion :",
                    texte
                );

                throw new Error(
                    "Insertion Supabase impossible."
                );

            }


            statutClassement.textContent =
                "🏆 Ton score a été ajouté au classement.";

        }


        /* =========================================
           SCORE EXISTANT
        ========================================= */

        else {

            const ancienScore =
                Number(
                    anciensScores[0].score
                );


            /*
               UPDATE UNIQUEMENT
               SI NOUVEAU RECORD.
            */

            if (
                meilleurScore >
                ancienScore
            ) {


                const id =
                    anciensScores[0].id;


                const miseAJour =
                    await fetch(

                        SUPABASE_URL +
                        "/rest/v1/scores" +

                        "?id=eq." +
                        encodeURIComponent(
                            id
                        ),

                        {

                            method: "PATCH",

                            headers: {

                                "apikey":
                                    SUPABASE_KEY,

                                "Authorization":
                                    "Bearer " +
                                    SUPABASE_KEY,

                                "Content-Type":
                                    "application/json",

                                "Prefer":
                                    "return=minimal"

                            },

                            body:
                                JSON.stringify({

                                    score:
                                        meilleurScore

                                })

                        }

                    );


                if (!miseAJour.ok) {

                    const texte =
                        await miseAJour.text();

                    console.error(
                        "Erreur UPDATE :",
                        texte
                    );

                    throw new Error(
                        "UPDATE Supabase impossible."
                    );

                }


                statutClassement.textContent =
                    "🔥 Nouveau record enregistré !";

            }

            else {

                statutClassement.textContent =
                    "ℹ️ Ton meilleur score reste "
                    +
                    ancienScore
                    +
                    " points.";

            }

        }


        /*
           Recharger le classement
        */

        await chargerClassement();

    }

    catch (erreur) {

        console.error(
            erreur
        );


        statutClassement.textContent =
            "❌ Erreur lors de l'enregistrement.";

    }

}


/* =====================================================
   CHARGER TOP 10
===================================================== */

async function chargerClassement() {

    try {

        /*
           IMPORTANT :
           ON FILTRE SUR jeu = jeux2
        */

        const resultat =
            await fetch(

                SUPABASE_URL +
                "/rest/v1/scores" +

                "?select=pseudo,score,jeu" +

                "&jeu=eq." +
                encodeURIComponent(
                    JEU
                ) +

                "&order=score.desc" +

                "&limit=10",

                {

                    method: "GET",

                    headers: {

                        "apikey":
                            SUPABASE_KEY,

                        "Authorization":
                            "Bearer " +
                            SUPABASE_KEY

                    }

                }

            );


        if (!resultat.ok) {

            const texte =
                await resultat.text();

            console.error(
                "Erreur classement :",
                texte
            );

            throw new Error(
                "Classement inaccessible."
            );

        }


        const scores =
            await resultat.json();


        listeScores.innerHTML =
            "";


        /* =========================================
           AUCUN SCORE
        ========================================= */

        if (
            scores.length === 0
        ) {

            listeScores.innerHTML = `

                <tr>

                    <td colspan="3">

                        Aucun score pour
                        Devine le nombre.

                    </td>

                </tr>

            `;


            statutClassement.textContent =
                "🌍 Aucun score pour ce jeu.";

            return;

        }


        /* =========================================
           AFFICHER TOP 10
        ========================================= */

        scores.forEach(
            function(
                joueurScore,
                index
            ) {

                const ligne =
                    document.createElement(
                        "tr"
                    );


                ligne.innerHTML = `

                    <td>
                        ${index + 1}
                    </td>

                    <td>
                        ${echapperHTML(
                            joueurScore.pseudo
                        )}
                    </td>

                    <td>
                        ${Number(
                            joueurScore.score
                        )}
                    </td>

                `;


                listeScores.appendChild(
                    ligne
                );

            }
        );


        statutClassement.textContent =
            "🌍 Classement Devine le nombre actualisé.";

    }

    catch (erreur) {

        console.error(
            erreur
        );


        listeScores.innerHTML = `

            <tr>

                <td colspan="3">

                    ❌ Impossible de charger
                    le classement.

                </td>

            </tr>

        `;


        statutClassement.textContent =
            "❌ Erreur lors du chargement du classement.";

    }

}


/* =====================================================
   SECURITE
===================================================== */

function echapperHTML(
    texte
) {

    return String(
        texte
    )

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#039;"
    );

}


/* =====================================================
   DEMARRAGE
===================================================== */

chargerClassement();

</script>


</body>

</html>
