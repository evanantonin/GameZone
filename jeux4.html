<body>

```
<nav>

    <a href="index.html">Accueil</a>

    <a href="liste-jeux.html">Jeux</a>

</nav>


<div class="jeu-snake">

    <h2>🐍 Snake</h2>

    <p>
        Utilise ZQSD ou les flèches
        pour contrôler le serpent.
    </p>


    <canvas
        id="jeu"
        width="400"
        height="400">
    </canvas>


    <p>
        Score :
        <span id="score">0</span>
    </p>


    <button onclick="recommencer()">
        🔄 Recommencer
    </button>


    <button
        onclick="pauseJeu()"
        id="boutonPause">
        ⏸️ Pause
    </button>


    <p id="message"></p>


    <!-- CONTRÔLES POUR TÉLÉPHONE -->

    <div class="controles-snake">

        <button
            onclick="changerDirectionTactile('haut')">
            ⬆️
        </button>

        <div>

            <button
                onclick="changerDirectionTactile('gauche')">
                ⬅️
            </button>

            <button
                onclick="changerDirectionTactile('bas')">
                ⬇️
            </button>

            <button
                onclick="changerDirectionTactile('droite')">
                ➡️
            </button>

        </div>

    </div>

</div>


<script>

    // =========================
    // VARIABLES
    // =========================

    let canvas =
        document.getElementById("jeu");

    let contexte =
        canvas.getContext("2d");


    let tailleCase = 20;


    // =========================
    // SERPENT
    // =========================

    let serpent = [

        { x: 200, y: 200 },

        { x: 180, y: 200 },

        { x: 160, y: 200 }

    ];


    // =========================
    // DIRECTION
    // =========================

    let direction = "droite";


    // =========================
    // NOURRITURE
    // =========================

    let nourriture = {

        x: 300,

        y: 200

    };


    // =========================
    // SCORE
    // =========================

    let score = 0;


    // =========================
    // ÉTAT DU JEU
    // =========================

    let jeuTermine = false;

    let jeuEnPause = false;


    // =========================
    // TOUCHES
    // =========================

    document.addEventListener(
        "keydown",
        changerDirection
    );


    function changerDirection(event) {

        // Empêcher l'écran de bouger
        // avec les flèches

        if (

            event.key === "ArrowUp" ||

            event.key === "ArrowDown" ||

            event.key === "ArrowLeft" ||

            event.key === "ArrowRight"

        ) {

            event.preventDefault();

        }


        // Z ou flèche haut

        if (

            (
                event.key === "z" ||
                event.key === "Z" ||
                event.key === "ArrowUp"
            )

            &&

            direction !== "bas"

        ) {

            direction = "haut";

        }


        // S ou flèche bas

        if (

            (
                event.key === "s" ||
                event.key === "S" ||
                event.key === "ArrowDown"
            )

            &&

            direction !== "haut"

        ) {

            direction = "bas";

        }


        // Q ou flèche gauche

        if (

            (
                event.key === "q" ||
                event.key === "Q" ||
                event.key === "ArrowLeft"
            )

            &&

            direction !== "droite"

        ) {

            direction = "gauche";

        }


        // D ou flèche droite

        if (

            (
                event.key === "d" ||
                event.key === "D" ||
                event.key === "ArrowRight"
            )

            &&

            direction !== "gauche"

        ) {

            direction = "droite";

        }

    }


    // =========================
    // BOUTONS TACTILES
    // =========================

    function changerDirectionTactile(
        nouvelleDirection
    ) {

        if (

            nouvelleDirection === "haut"

            &&

            direction !== "bas"

        ) {

            direction = "haut";

        }


        if (

            nouvelleDirection === "bas"

            &&

            direction !== "haut"

        ) {

            direction = "bas";

        }


        if (

            nouvelleDirection === "gauche"

            &&

            direction !== "droite"

        ) {

            direction = "gauche";

        }


        if (

            nouvelleDirection === "droite"

            &&

            direction !== "gauche"

        ) {

            direction = "droite";

        }

    }


    // =========================
    // DESSINER
    // =========================

    function dessiner() {

        // Effacer le terrain

        contexte.clearRect(
            0,
            0,
            canvas.width,
            canvas.height
        );


        // Dessiner le serpent

        for (let partie of serpent) {

            contexte.fillStyle = "green";

            contexte.fillRect(

                partie.x,

                partie.y,

                tailleCase,

                tailleCase

            );

        }


        // Dessiner la nourriture

        contexte.fillStyle = "red";

        contexte.fillRect(

            nourriture.x,

            nourriture.y,

            tailleCase,

            tailleCase

        );

    }


    // =========================
    // FAIRE AVANCER LE SERPENT
    // =========================

    function avancer() {

        if (
            jeuTermine ||
            jeuEnPause
        ) {

            return;

        }


        // Nouvelle tête

        let tete = {

            x: serpent[0].x,

            y: serpent[0].y

        };


        // Déplacement

        if (direction === "droite") {

            tete.x += tailleCase;

        }


        if (direction === "gauche") {

            tete.x -= tailleCase;

        }


        if (direction === "haut") {

            tete.y -= tailleCase;

        }


        if (direction === "bas") {

            tete.y += tailleCase;

        }


        // =========================
        // TRAVERSER LES BORDS
        // =========================

        if (tete.x < 0) {

            tete.x =
                canvas.width - tailleCase;

        }


        if (tete.x >= canvas.width) {

            tete.x = 0;

        }


        if (tete.y < 0) {

            tete.y =
                canvas.height - tailleCase;

        }


        if (tete.y >= canvas.height) {

            tete.y = 0;

        }


        // Ajouter la tête

        serpent.unshift(tete);


        // =========================
        // MANGER
        // =========================

        if (

            tete.x === nourriture.x &&

            tete.y === nourriture.y

        ) {

            score++;


            document.getElementById(
                "score"
            ).textContent = score;


            nouvelleNourriture();

        }

        else {

            // Retirer la queue

            serpent.pop();

        }


        // =========================
        // SE MORDRE
        // =========================

        for (

            let i = 1;

            i < serpent.length;

            i++

        ) {

            if (

                tete.x === serpent[i].x &&

                tete.y === serpent[i].y

            ) {

                terminerJeu();

                return;

            }

        }


        dessiner();

    }


    // =========================
    // NOUVELLE NOURRITURE
    // =========================

    function nouvelleNourriture() {

        nourriture.x =

            Math.floor(

                Math.random() *

                (
                    canvas.width /
                    tailleCase
                )

            ) * tailleCase;


        nourriture.y =

            Math.floor(

                Math.random() *

                (
                    canvas.height /
                    tailleCase
                )

            ) * tailleCase;

    }


    // =========================
    // GAME OVER
    // =========================

    function terminerJeu() {

        jeuTermine = true;


        document.getElementById(
            "message"
        ).textContent =

            "💀 Game Over ! Score : "
            + score;

    }


    // =========================
    // PAUSE
    // =========================

    function pauseJeu() {

        if (jeuTermine) {

            return;

        }


        jeuEnPause =
            !jeuEnPause;


        let bouton =
            document.getElementById(
                "boutonPause"
            );


        if (jeuEnPause) {

            bouton.textContent =
                "▶️ Reprendre";


            document.getElementById(
                "message"
            ).textContent =
                "⏸️ Jeu en pause";

        }

        else {

            bouton.textContent =
                "⏸️ Pause";


            document.getElementById(
                "message"
            ).textContent =
                "";

        }

    }


    // =========================
    // RECOMMENCER
    // =========================

    function recommencer() {

        serpent = [

            { x: 200, y: 200 },

            { x: 180, y: 200 },

            { x: 160, y: 200 }

        ];


        direction = "droite";


        score = 0;


        jeuTermine = false;

        jeuEnPause = false;


        document.getElementById(
            "score"
        ).textContent = "0";


        document.getElementById(
            "message"
        ).textContent = "";


        document.getElementById(
            "boutonPause"
        ).textContent =
            "⏸️ Pause";


        nouvelleNourriture();


        dessiner();

    }


    // =========================
    // LANCER LE JEU
    // =========================

    dessiner();


    setInterval(
        avancer,
        120
    );

</script>
```

</body>

</html>
