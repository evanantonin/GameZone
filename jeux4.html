<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>GameZone - Snake</title>

    <link rel="stylesheet" href="style.css">

    <!-- SUPABASE -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    

</head>


<body class="page-jeu">
    <script>
    if (!localStorage.getItem("pseudoGameZone")) {
        window.location.href = "index.html";
    }
</script>


    <!-- =========================
         MENU
    ========================= -->

    <nav>

        <a href="index.html">
            🏠 Accueil
        </a>

        <a href="liste-jeux.html">
            🎮 Jeux
        </a>

    </nav>


    <!-- =========================
         SNAKE
    ========================= -->

    <div class="jeu-snake">

        <h2>
            🐍 Snake
        </h2>


        <a href="liste-jeux.html"
           class="bouton-retour">

            ⬅️ Retour aux jeux

        </a>


        <!-- =========================
             PSEUDO
        ========================= -->

        <div class="pseudo-joueur">

            👤 Joueur :

            <span id="pseudoJoueur">
                Chargement...
            </span>

        </div>


        <p>
            🖥️ PC : ZQSD ou flèches
        </p>

        <p>
            📱 Mobile : utilise les boutons
        </p>


        <!-- =========================
             TERRAIN
        ========================= -->

        <canvas
            id="jeu"
            width="400"
            height="400">
        </canvas>


        <!-- =========================
             SCORES
        ========================= -->

        <div class="scores-snake">

            <div class="score-box">

                <p>
                    🏆 Score
                </p>

                <p>
                    <span id="score">
                        0
                    </span>
                </p>

            </div>


            <div class="score-box">

                <p>
                    👑 Meilleur score
                </p>

                <p>
                    <span id="meilleurScore">
                        0
                    </span>
                </p>

            </div>

        </div>


        <!-- =========================
             BOUTONS
        ========================= -->

        <div class="boutons-jeu">

            <button onclick="recommencer()">

                🔄 Recommencer

            </button>


            <button
                onclick="pauseJeu()"
                id="boutonPause">

                ⏸️ Pause

            </button>


            <button
                onclick="rejouer()"
                id="boutonRejouer">

                🔄 Rejouer

            </button>

        </div>


        <!-- =========================
             MESSAGE
        ========================= -->

        <p id="message"></p>


        <!-- =========================
             ENREGISTRER LE SCORE
        ========================= -->

        <div id="zoneEnregistrement">

            <h3>
                🏆 Enregistrer ton score
            </h3>

            <p>
                👤 Pseudo :
                <strong id="pseudoAffiche"></strong>
            </p>

            <p>
                🎯 Score :
                <strong id="scoreFinal"></strong>
            </p>

            <button
                id="enregistrerScore"
                onclick="enregistrerMeilleurScore()">

                💾 Enregistrer le score

            </button>

            <p id="messageEnregistrement"></p>

        </div>


        <!-- =========================
             CONTROLES MOBILE
        ========================= -->

        <div class="controles-snake">

            <button
                onclick="changerDirectionTactile('haut')">

                ⬆️

            </button>


            <div class="ligne-controles">

                <button
                    onclick="changerDirectionTactile('gauche')">

                    ⬅️

                </button>


                <button
                    onclick="changerDirectionTactile('bas')">

                    ⬇️

                </button>


                <button
                    onclick="changerDirectionTactile('droite')">

                    ➡️

                </button>

            </div>

        </div>

    </div>


    <!-- =========================
         CLASSEMENT
    ========================= -->

    <section class="classement">

        <h2>
            🌍 🏆 TOP 10 MONDIAL - SNAKE
        </h2>


        <table id="tableauClassement">

            <thead>

                <tr>

                    <th>#</th>

                    <th>👤 Pseudo</th>

                    <th>🐍 Score</th>

                </tr>

            </thead>


            <tbody id="classementBody">

                <tr>

                    <td colspan="3">
                        ⏳ Chargement...
                    </td>

                </tr>

            </tbody>

        </table>


        <p
            id="messageClassement"
            class="message-classement">
        </p>

    </section>


    <!-- =========================
         JAVASCRIPT
    ========================= -->

    <script>


        /* =====================================================
           SUPABASE
        ===================================================== */

        const SUPABASE_URL =
            "https://pxgymcwpbesqyjochwgd.supabase.co";


        const SUPABASE_ANON_KEY =
            "sb_publishable_F0af00-z9ZDemm9ch1tIaA_wSNCZb9G";


        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_ANON_KEY
            );


        /* =====================================================
           IDENTIFICATION DU JEU
        ===================================================== */

        const JEU = "jeux4";


        /* =====================================================
           PSEUDO
        ===================================================== */

        const pseudo =
            localStorage.getItem(
                "pseudoGameZone"
            );


        if (pseudo) {

            document.getElementById(
                "pseudoJoueur"
            ).textContent =
                pseudo;


            document.getElementById(
                "pseudoAffiche"
            ).textContent =
                pseudo;

        }

        else {

            document.getElementById(
                "pseudoJoueur"
            ).textContent =
                "Aucun pseudo";


            document.getElementById(
                "pseudoAffiche"
            ).textContent =
                "Aucun pseudo";

        }


        /* =====================================================
           CANVAS
        ===================================================== */

        const canvas =
            document.getElementById("jeu");


        const contexte =
            canvas.getContext("2d");


        const tailleCase = 20;


        /* =====================================================
           VARIABLES SNAKE
        ===================================================== */

        let serpent = [

            { x: 200, y: 200 },

            { x: 180, y: 200 },

            { x: 160, y: 200 }

        ];


        let direction = "droite";


        let nourriture = {

            x: 300,

            y: 200

        };


        let score = 0;


        let meilleurScore =
            Number(
                localStorage.getItem(
                    "meilleurScoreSnake"
                )
            ) || 0;


        let jeuTermine = false;


        let jeuEnPause = false;


        let scoreEnregistre = false;


        /* =====================================================
           AFFICHER MEILLEUR SCORE
        ===================================================== */

        document.getElementById(
            "meilleurScore"
        ).textContent =
            meilleurScore;


        /* =====================================================
           CLAVIER
        ===================================================== */

        document.addEventListener(
            "keydown",
            changerDirection
        );


        function changerDirection(event) {

            const touche =
                event.key.toLowerCase();


            if (

                event.key === "ArrowUp" ||
                event.key === "ArrowDown" ||
                event.key === "ArrowLeft" ||
                event.key === "ArrowRight"

            ) {

                event.preventDefault();

            }


            if (

                (
                    touche === "z" ||
                    event.key === "ArrowUp"
                )

                &&

                direction !== "bas"

            ) {

                direction = "haut";

            }


            if (

                (
                    touche === "s" ||
                    event.key === "ArrowDown"
                )

                &&

                direction !== "haut"

            ) {

                direction = "bas";

            }


            if (

                (
                    touche === "q" ||
                    event.key === "ArrowLeft"
                )

                &&

                direction !== "droite"

            ) {

                direction = "gauche";

            }


            if (

                (
                    touche === "d" ||
                    event.key === "ArrowRight"
                )

                &&

                direction !== "gauche"

            ) {

                direction = "droite";

            }

        }


        /* =====================================================
           CONTROLES MOBILE
        ===================================================== */

        function changerDirectionTactile(
            nouvelleDirection
        ) {

            if (jeuTermine || jeuEnPause) {

                return;

            }


            if (

                nouvelleDirection === "haut" &&
                direction !== "bas"

            ) {

                direction = "haut";

            }


            if (

                nouvelleDirection === "bas" &&
                direction !== "haut"

            ) {

                direction = "bas";

            }


            if (

                nouvelleDirection === "gauche" &&
                direction !== "droite"

            ) {

                direction = "gauche";

            }


            if (

                nouvelleDirection === "droite" &&
                direction !== "gauche"

            ) {

                direction = "droite";

            }

        }


        /* =====================================================
           DESSIN
        ===================================================== */

        function dessiner() {

            contexte.clearRect(
                0,
                0,
                canvas.width,
                canvas.height
            );


            contexte.fillStyle =
                "#eeeeee";


            contexte.fillRect(
                0,
                0,
                canvas.width,
                canvas.height
            );


            /* =========================
               SERPENT
            ========================= */

            for (
                let i = 0;
                i < serpent.length;
                i++
            ) {

                contexte.fillStyle =
                    i === 0
                        ? "#0b8f00"
                        : "#21b51a";


                contexte.fillRect(

                    serpent[i].x,

                    serpent[i].y,

                    tailleCase - 1,

                    tailleCase - 1

                );

            }


            /* =========================
               NOURRITURE
            ========================= */

            contexte.fillStyle =
                "red";


            contexte.fillRect(

                nourriture.x,

                nourriture.y,

                tailleCase - 1,

                tailleCase - 1

            );

        }


        /* =====================================================
           AVANCER
        ===================================================== */

        function avancer() {

            if (

                jeuTermine ||
                jeuEnPause

            ) {

                return;

            }


            let tete = {

                x: serpent[0].x,

                y: serpent[0].y

            };


            /* =========================
               DIRECTION
            ========================= */

            if (direction === "droite") {

                tete.x += tailleCase;

            }


            if (direction === "gauche") {

                tete.x -= tailleCase;

            }


            if (direction === "haut") {

                tete.y -= tailleCase;

            }


            if (direction === "bas") {

                tete.y += tailleCase;

            }


            /* =========================
               TRAVERSER LES BORDS
            ========================= */

            if (tete.x < 0) {

                tete.x =
                    canvas.width - tailleCase;

            }


            if (tete.x >= canvas.width) {

                tete.x = 0;

            }


            if (tete.y < 0) {

                tete.y =
                    canvas.height - tailleCase;

            }


            if (tete.y >= canvas.height) {

                tete.y = 0;

            }


            serpent.unshift(tete);


            /* =========================
               MANGER
            ========================= */

            if (

                tete.x === nourriture.x &&
                tete.y === nourriture.y

            ) {

                score++;


                document.getElementById(
                    "score"
                ).textContent =
                    score;


                /* =========================
                   NOUVEAU RECORD LOCAL
                ========================= */

                if (score > meilleurScore) {

                    meilleurScore =
                        score;


                    document.getElementById(
                        "meilleurScore"
                    ).textContent =
                        meilleurScore;


                    localStorage.setItem(
                        "meilleurScoreSnake",
                        meilleurScore
                    );

                }


                nouvelleNourriture();

            }

            else {

                serpent.pop();

            }


            /* =========================
               COLLISION AVEC LE CORPS
            ========================= */

            for (

                let i = 1;

                i < serpent.length;

                i++

            ) {

                if (

                    tete.x === serpent[i].x &&
                    tete.y === serpent[i].y

                ) {

                    terminerJeu();

                    return;

                }

            }


            dessiner();

        }


        /* =====================================================
           NOURRITURE
        ===================================================== */

        function nouvelleNourriture() {

            let positionValide =
                false;


            while (!positionValide) {

                nourriture.x =
                    Math.floor(
                        Math.random() *
                        (canvas.width / tailleCase)
                    ) * tailleCase;


                nourriture.y =
                    Math.floor(
                        Math.random() *
                        (canvas.height / tailleCase)
                    ) * tailleCase;


                positionValide =
                    !serpent.some(
                        function(partie) {

                            return (

                                partie.x ===
                                nourriture.x

                                &&

                                partie.y ===
                                nourriture.y

                            );

                        }
                    );

            }

        }


        /* =====================================================
           GAME OVER
        ===================================================== */

        function terminerJeu() {

            jeuTermine = true;


            document.getElementById(
                "boutonPause"
            ).disabled = true;


            document.getElementById(
                "boutonRejouer"
            ).style.display =
                "inline-block";


            document.getElementById(
                "zoneEnregistrement"
            ).style.display =
                "block";


            document.getElementById(
                "scoreFinal"
            ).textContent =
                score;


            if (

                score === meilleurScore &&
                score > 0

            ) {

                document.getElementById(
                    "message"
                ).textContent =
                    "👑 NOUVEAU RECORD ! Score : "
                    + score;

            }

            else {

                document.getElementById(
                    "message"
                ).textContent =
                    "💀 Game Over ! Score : "
                    + score;

            }

        }


        /* =====================================================
           PAUSE
        ===================================================== */

        function pauseJeu() {

            if (jeuTermine) {

                return;

            }


            jeuEnPause =
                !jeuEnPause;


            const bouton =
                document.getElementById(
                    "boutonPause"
                );


            if (jeuEnPause) {

                bouton.textContent =
                    "▶️ Reprendre";


                document.getElementById(
                    "message"
                ).textContent =
                    "⏸️ Jeu en pause";

            }

            else {

                bouton.textContent =
                    "⏸️ Pause";


                document.getElementById(
                    "message"
                ).textContent =
                    "";

            }

        }


        /* =====================================================
           RECOMMENCER
        ===================================================== */

        function recommencer() {

            clearInterval(intervalle);


            serpent = [

                { x: 200, y: 200 },

                { x: 180, y: 200 },

                { x: 160, y: 200 }

            ];


            direction = "droite";


            score = 0;


            jeuTermine = false;


            jeuEnPause = false;


            scoreEnregistre = false;


            document.getElementById(
                "score"
            ).textContent =
                "0";


            document.getElementById(
                "message"
            ).textContent =
                "";


            document.getElementById(
                "boutonPause"
            ).textContent =
                "⏸️ Pause";


            document.getElementById(
                "boutonPause"
            ).disabled =
                false;


            document.getElementById(
                "boutonRejouer"
            ).style.display =
                "none";


            document.getElementById(
                "zoneEnregistrement"
            ).style.display =
                "none";


            document.getElementById(
                "messageEnregistrement"
            ).textContent =
                "";


            nouvelleNourriture();


            dessiner();


            intervalle =
                setInterval(
                    avancer,
                    120
                );

        }


        /* =====================================================
           REJOUER
        ===================================================== */

        function rejouer() {

            recommencer();

        }


        /* =====================================================
           ENREGISTRER LE MEILLEUR SCORE
        ===================================================== */

        async function enregistrerMeilleurScore() {

            const message =
                document.getElementById(
                    "messageEnregistrement"
                );


            const pseudoActuel =
                localStorage.getItem(
                    "pseudoGameZone"
                );


            /* =========================
               VÉRIFIER PSEUDO
            ========================= */

            if (!pseudoActuel) {

                message.textContent =
                    "❌ Aucun pseudo trouvé. Retourne à l'accueil.";

                return;

            }


            /* =========================
               VÉRIFIER SCORE
            ========================= */

            if (score <= 0) {

                message.textContent =
                    "⚠️ Ton score doit être supérieur à 0.";

                return;

            }


            /* =========================
               EMPÊCHER DOUBLE CLIC
            ========================= */

            if (scoreEnregistre) {

                message.textContent =
                    "ℹ️ Ce score a déjà été enregistré.";

                return;

            }


            scoreEnregistre = true;


            message.textContent =
                "⏳ Enregistrement...";


            try {

                /* =========================
                   CHERCHER LE SCORE EXISTANT
                ========================= */

                const {

                    data: ancienScore,

                    error: erreurRecherche

                } =

                    await supabaseClient

                        .from("scores")

                        .select(
                            "pseudo,score,jeu"
                        )

                        .eq(
                            "pseudo",
                            pseudoActuel
                        )

                        .eq(
                            "jeu",
                            JEU
                        )

                        .limit(1);


                if (erreurRecherche) {

                    console.error(
                        "Erreur recherche :",
                        erreurRecherche
                    );


                    scoreEnregistre =
                        false;


                    message.textContent =
                        "❌ Impossible de rechercher ton score.";

                    return;

                }


                /* =========================
                   SCORE EXISTANT
                ========================= */

                if (

                    ancienScore &&
                    ancienScore.length > 0

                ) {

                    const scoreExistant =
                        Number(
                            ancienScore[0].score
                        );


                    /* =========================
                       MEILLEUR SCORE
                    ========================= */

                    if (

                        score >
                        scoreExistant

                    ) {

                        const {

                            error: erreurUpdate

                        } =

                            await supabaseClient

                                .from("scores")

                                .update({

                                    score:
                                        score,

                                    date_creation:
                                        new Date()
                                            .toISOString()

                                })

                                .eq(
                                    "pseudo",
                                    pseudoActuel
                                )

                                .eq(
                                    "jeu",
                                    JEU
                                );


                        if (erreurUpdate) {

                            console.error(
                                "Erreur update :",
                                erreurUpdate
                            );


                            scoreEnregistre =
                                false;


                            message.textContent =
                                "❌ Impossible de mettre à jour le score.";

                            return;

                        }


                        message.textContent =
                            "🏆 Nouveau record enregistré !";

                    }

                    else {

                        message.textContent =
                            "ℹ️ Ton ancien score est meilleur ou égal.";

                    }

                }


                /* =========================
                   PREMIER SCORE
                ========================= */

                else {

                    const {

                        error: erreurInsertion

                    } =

                        await supabaseClient

                            .from("scores")

                            .insert({

                                pseudo:
                                    pseudoActuel,

                                score:
                                    score,

                                jeu:
                                    JEU,

                                date_creation:
                                    new Date()
                                        .toISOString()

                            });


                    if (erreurInsertion) {

                        console.error(
                            "Erreur insertion :",
                            erreurInsertion
                        );


                        scoreEnregistre =
                            false;


                        message.textContent =
                            "❌ Impossible d'enregistrer le score.";

                        return;

                    }


                    message.textContent =
                        "✅ Score enregistré !";

                }


                /* =========================
                   ACTUALISER CLASSEMENT
                ========================= */

                await chargerClassement();

            }

            catch (erreur) {

                console.error(
                    "Erreur :",
                    erreur
                );


                scoreEnregistre =
                    false;


                message.textContent =
                    "❌ Erreur lors de l'enregistrement.";

            }

        }


        /* =====================================================
           CHARGER CLASSEMENT
        ===================================================== */

        async function chargerClassement() {

            const tbody =
                document.getElementById(
                    "classementBody"
                );


            tbody.innerHTML = `

                <tr>

                    <td colspan="3">

                        ⏳ Chargement...

                    </td>

                </tr>

            `;


            try {

                const {

                    data,
                    error

                } =

                    await supabaseClient

                        .from("scores")

                        .select(
                            "pseudo,score,date_creation"
                        )

                        .eq(
                            "jeu",
                            JEU
                        )

                        .order(
                            "score",
                            {
                                ascending: false
                            }
                        )

                        .limit(10);


                if (error) {

                    console.error(
                        "Erreur classement :",
                        error
                    );


                    throw new Error(
                        "Classement impossible."
                    );

                }


                /* =========================
                   AUCUN SCORE
                ========================= */

                if (

                    !data ||
                    data.length === 0

                ) {

                    tbody.innerHTML = `

                        <tr>

                            <td colspan="3">

                                Aucun score pour Snake.

                            </td>

                        </tr>

                    `;

                    return;

                }


                /* =========================
                   AFFICHER
                ========================= */

                tbody.innerHTML = "";


                data.forEach(
                    function(
                        joueur,
                        index
                    ) {

                        const ligne =
                            document.createElement(
                                "tr"
                            );


                        const position =
                            document.createElement(
                                "td"
                            );


                        if (index === 0) {

                            position.textContent =
                                "🥇";

                        }

                        else if (index === 1) {

                            position.textContent =
                                "🥈";

                        }

                        else if (index === 2) {

                            position.textContent =
                                "🥉";

                        }

                        else {

                            position.textContent =
                                index + 1;

                        }


                        const pseudoCell =
                            document.createElement(
                                "td"
                            );


                        pseudoCell.textContent =
                            joueur.pseudo;


                        const scoreCell =
                            document.createElement(
                                "td"
                            );


                        scoreCell.textContent =
                            "🐍 " +
                            joueur.score;


                        ligne.appendChild(
                            position
                        );


                        ligne.appendChild(
                            pseudoCell
                        );


                        ligne.appendChild(
                            scoreCell
                        );


                        tbody.appendChild(
                            ligne
                        );

                    }
                );

            }

            catch (erreur) {

                console.error(
                    "Erreur :",
                    erreur
                );


                tbody.innerHTML = `

                    <tr>

                        <td colspan="3">

                            ❌ Impossible de charger le classement.

                        </td>

                    </tr>

                `;

            }

        }


        /* =====================================================
           LANCEMENT
        ===================================================== */

        dessiner();


        let intervalle =
            setInterval(
                avancer,
                120
            );


        /* =====================================================
           CLASSEMENT AU CHARGEMENT
        ===================================================== */

        chargerClassement();

    </script>

</body>

</html>
