<!DOCTYPE html>

<html lang="fr">

<head>


<meta charset="UTF-8">

<meta name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>GameZone - Snake</title>

<link rel="stylesheet" href="style.css">

<style>

    /* =========================
       SNAKE
    ========================= */

    .jeu-snake {
        max-width: 600px;
        margin: 20px auto;
        text-align: center;
    }


    #jeu {
        display: block;
        width: min(90vw, 400px);
        height: auto;
        aspect-ratio: 1 / 1;

        border: 5px solid black;
        background-color: #eeeeee;

        margin: 20px auto;

        touch-action: none;
    }


    /* =========================
       CONTRÔLES
    ========================= */

    .controles-snake {
        display: flex;
        flex-direction: column;
        align-items: center;

        margin-top: 20px;

        user-select: none;
    }


    .ligne-controles {
        display: flex;
        justify-content: center;
    }


    .controles-snake button {
        width: 70px;
        height: 60px;

        margin: 5px;

        font-size: 28px;

        border-radius: 15px;

        touch-action: manipulation;

        -webkit-tap-highlight-color: transparent;
    }


    .controles-snake button:active {
        transform: scale(0.90);
    }


    /* =========================
       BOUTONS DU JEU
    ========================= */

    .boutons-jeu {
        display: flex;
        justify-content: center;
        gap: 10px;

        flex-wrap: wrap;

        margin-top: 15px;
    }


    .boutons-jeu button {
        font-size: 16px;
        padding: 12px 18px;
    }


    /* =========================
       MESSAGE
    ========================= */

    #message {
        min-height: 25px;
        font-size: 20px;
        font-weight: bold;
    }


    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 600px) {

        body {
            margin: 8px;
        }


        nav {
            padding: 12px;
            text-align: center;
        }


        nav a {
            font-size: 17px;
            margin-right: 15px;
        }


        .jeu-snake {
            width: 100%;
            padding: 15px 5px;
            box-sizing: border-box;
        }


        .jeu-snake h2 {
            font-size: 28px;
        }


        .jeu-snake p {
            font-size: 16px;
        }


        #jeu {
            width: 92vw;
            max-width: 400px;

            border-width: 4px;

            margin: 15px auto;
        }


        .controles-snake {
            margin-top: 15px;
        }


        .controles-snake button {
            width: 75px;
            height: 65px;

            font-size: 30px;

            margin: 4px;
        }


        .boutons-jeu {
            gap: 8px;
        }


        .boutons-jeu button {
            padding: 14px 18px;
            font-size: 17px;
        }

    }


    /* =========================
       PETITS TÉLÉPHONES
    ========================= */

    @media (max-width: 380px) {

        .controles-snake button {
            width: 62px;
            height: 58px;

            font-size: 25px;
        }


        .jeu-snake h2 {
            font-size: 24px;
        }


        #jeu {
            width: 90vw;
        }

    }

</style>


</head>

<body>


<nav>

    <a href="index.html">
        Accueil
    </a>

    <a href="liste-jeux.html">
        Jeux
    </a>
    <a href="liste-jeux.html">
    <button>⬅️ Retour aux jeux</button>
</a>


</nav>



<div class="jeu-snake">

    <h2>🐍 Snake</h2>


    <p>
        🖥️ PC : ZQSD ou flèches
    </p>

    <p>
        📱 Mobile : utilise les boutons
    </p>


    <canvas
        id="jeu"
        width="400"
        height="400">
    </canvas>


    <p>
        🏆 Score :
        <strong id="score">0</strong>
    </p>


    <div class="boutons-jeu">

        <button onclick="recommencer()">
            🔄 Recommencer
        </button>

        <button
            onclick="pauseJeu()"
            id="boutonPause">
            ⏸️ Pause
        </button>

    </div>


    <p id="message"></p>


    <!-- CONTRÔLES MOBILE -->

    <div class="controles-snake">

        <button
            onclick="changerDirectionTactile('haut')"
            aria-label="Haut">
            ⬆️
        </button>


        <div class="ligne-controles">

            <button
                onclick="changerDirectionTactile('gauche')"
                aria-label="Gauche">
                ⬅️
            </button>


            <button
                onclick="changerDirectionTactile('bas')"
                aria-label="Bas">
                ⬇️
            </button>


            <button
                onclick="changerDirectionTactile('droite')"
                aria-label="Droite">
                ➡️
            </button>

        </div>

    </div>

</div>


<script>

    // =========================
    // VARIABLES
    // =========================

    let canvas =
        document.getElementById("jeu");

    let contexte =
        canvas.getContext("2d");


    let tailleCase = 20;


    let serpent = [

        { x: 200, y: 200 },

        { x: 180, y: 200 },

        { x: 160, y: 200 }

    ];


    let direction = "droite";


    let nourriture = {
        x: 300,
        y: 200
    };


    let score = 0;


    let jeuTermine = false;

    let jeuEnPause = false;


    // =========================
    // CLAVIER
    // =========================

    document.addEventListener(
        "keydown",
        changerDirection
    );


    function changerDirection(event) {

        const touche =
            event.key.toLowerCase();


        // Empêcher le défilement

        if (

            event.key === "ArrowUp" ||
            event.key === "ArrowDown" ||
            event.key === "ArrowLeft" ||
            event.key === "ArrowRight"

        ) {

            event.preventDefault();

        }


        if (

            (touche === "z" ||
            event.key === "ArrowUp")

            &&

            direction !== "bas"

        ) {

            direction = "haut";

        }


        if (

            (touche === "s" ||
            event.key === "ArrowDown")

            &&

            direction !== "haut"

        ) {

            direction = "bas";

        }


        if (

            (touche === "q" ||
            event.key === "ArrowLeft")

            &&

            direction !== "droite"

        ) {

            direction = "gauche";

        }


        if (

            (touche === "d" ||
            event.key === "ArrowRight")

            &&

            direction !== "gauche"

        ) {

            direction = "droite";

        }

    }


    // =========================
    // CONTRÔLES TACTILES
    // =========================

    function changerDirectionTactile(
        nouvelleDirection
    ) {

        if (

            nouvelleDirection === "haut" &&
            direction !== "bas"

        ) {

            direction = "haut";

        }


        if (

            nouvelleDirection === "bas" &&
            direction !== "haut"

        ) {

            direction = "bas";

        }


        if (

            nouvelleDirection === "gauche" &&
            direction !== "droite"

        ) {

            direction = "gauche";

        }


        if (

            nouvelleDirection === "droite" &&
            direction !== "gauche"

        ) {

            direction = "droite";

        }

    }


    // =========================
    // DESSIN
    // =========================

    function dessiner() {

        contexte.clearRect(
            0,
            0,
            canvas.width,
            canvas.height
        );


        // Fond

        contexte.fillStyle = "#eeeeee";

        contexte.fillRect(
            0,
            0,
            canvas.width,
            canvas.height
        );


        // Serpent

        for (
            let i = 0;
            i < serpent.length;
            i++
        ) {

            contexte.fillStyle =
                i === 0
                    ? "#0b8f00"
                    : "#21b51a";


            contexte.fillRect(

                serpent[i].x,

                serpent[i].y,

                tailleCase - 1,

                tailleCase - 1

            );

        }


        // Nourriture

        contexte.fillStyle = "red";


        contexte.fillRect(

            nourriture.x,

            nourriture.y,

            tailleCase - 1,

            tailleCase - 1

        );

    }


    // =========================
    // AVANCER
    // =========================

    function avancer() {

        if (
            jeuTermine ||
            jeuEnPause
        ) {

            return;

        }


        let tete = {

            x: serpent[0].x,

            y: serpent[0].y

        };


        if (direction === "droite") {

            tete.x += tailleCase;

        }


        if (direction === "gauche") {

            tete.x -= tailleCase;

        }


        if (direction === "haut") {

            tete.y -= tailleCase;

        }


        if (direction === "bas") {

            tete.y += tailleCase;

        }


        // Traverser les bords

        if (tete.x < 0) {

            tete.x =
                canvas.width - tailleCase;

        }


        if (tete.x >= canvas.width) {

            tete.x = 0;

        }


        if (tete.y < 0) {

            tete.y =
                canvas.height - tailleCase;

        }


        if (tete.y >= canvas.height) {

            tete.y = 0;

        }


        serpent.unshift(tete);


        // Manger

        if (

            tete.x === nourriture.x &&
            tete.y === nourriture.y

        ) {

            score++;


            document.getElementById(
                "score"
            ).textContent = score;


            nouvelleNourriture();

        }

        else {

            serpent.pop();

        }


        // Collision avec le corps

        for (

            let i = 1;
            i < serpent.length;
            i++

        ) {

            if (

                tete.x === serpent[i].x &&
                tete.y === serpent[i].y

            ) {

                terminerJeu();

                return;

            }

        }


        dessiner();

    }


    // =========================
    // NOURRITURE
    // =========================

    function nouvelleNourriture() {

        nourriture.x =

            Math.floor(

                Math.random() *
                (canvas.width / tailleCase)

            ) * tailleCase;


        nourriture.y =

            Math.floor(

                Math.random() *
                (canvas.height / tailleCase)

            ) * tailleCase;

    }


    // =========================
    // GAME OVER
    // =========================

    function terminerJeu() {

        jeuTermine = true;


        document.getElementById(
            "message"
        ).textContent =

            "💀 Game Over ! Score : "
            + score;

    }


    // =========================
    // PAUSE
    // =========================

    function pauseJeu() {

        if (jeuTermine) {

            return;

        }


        jeuEnPause =
            !jeuEnPause;


        let bouton =
            document.getElementById(
                "boutonPause"
            );


        if (jeuEnPause) {

            bouton.textContent =
                "▶️ Reprendre";


            document.getElementById(
                "message"
            ).textContent =
                "⏸️ Jeu en pause";

        }

        else {

            bouton.textContent =
                "⏸️ Pause";


            document.getElementById(
                "message"
            ).textContent =
                "";

        }

    }


    // =========================
    // RECOMMENCER
    // =========================

    function recommencer() {

        serpent = [

            { x: 200, y: 200 },

            { x: 180, y: 200 },

            { x: 160, y: 200 }

        ];


        direction = "droite";


        score = 0;


        jeuTermine = false;

        jeuEnPause = false;


        document.getElementById(
            "score"
        ).textContent = "0";


        document.getElementById(
            "message"
        ).textContent = "";


        document.getElementById(
            "boutonPause"
        ).textContent =
            "⏸️ Pause";


        nouvelleNourriture();


        dessiner();

    }


    // =========================
    // LANCEMENT
    // =========================

    dessiner();


    setInterval(
        avancer,
        120
    );

</script>


</body>

</html>
