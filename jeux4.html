<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>GameZone - Snake</title>

    <link rel="stylesheet" href="style.css">

    <!-- SUPABASE -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        /* =========================
           PAGE
        ========================= */

        body.page-jeu {
            background-color: #111;
            color: white;
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
        }


        /* =========================
           MENU
        ========================= */

        nav {
            background-color: black;
            padding: 15px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
            font-size: 20px;
        }

        nav a:hover {
            color: #00aaff;
        }


        /* =========================
           CONTENEUR
        ========================= */

        .jeu-snake {
            max-width: 600px;
            margin: 20px auto;
            padding: 20px;

            text-align: center;

            background-color: #1e1e1e;

            border: 3px solid #20c20e;
            border-radius: 20px;

            box-shadow:
                0 10px 25px rgba(0, 0, 0, 0.5);

            box-sizing: border-box;
        }


        /* =========================
           TITRE
        ========================= */

        .jeu-snake h2 {
            color: #35e51f;
            font-size: 30px;
        }


        /* =========================
           PSEUDO
        ========================= */

        .pseudo-joueur {
            margin: 15px auto;

            padding: 10px;

            max-width: 400px;

            background-color: #222;

            border: 2px solid #35e51f;

            border-radius: 10px;

            font-size: 18px;
        }

        #pseudoJoueur {
            color: #35e51f;
            font-weight: bold;
        }


        /* =========================
           TEXTE
        ========================= */

        .jeu-snake p {
            color: white;
            font-size: 17px;
        }


        /* =========================
           RETOUR
        ========================= */

        .bouton-retour {
            display: inline-block;

            margin: 10px 0 15px 0;

            padding: 10px 18px;

            background-color: #007bff;

            color: white;

            text-decoration: none;

            border-radius: 10px;

            font-size: 16px;

            transition: 0.2s;
        }

        .bouton-retour:hover {
            background-color: #00aaff;
            transform: scale(1.05);
        }


        /* =========================
           TERRAIN
        ========================= */

        #jeu {
            display: block;

            width: min(90vw, 400px);

            height: auto;

            aspect-ratio: 1 / 1;

            border: 5px solid black;

            background-color: #eeeeee;

            margin: 20px auto;

            touch-action: none;

            box-sizing: border-box;
        }


        /* =========================
           SCORES
        ========================= */

        .scores-snake {
            display: flex;

            justify-content: center;

            gap: 30px;

            flex-wrap: wrap;

            margin: 15px 0;
        }

        .score-box {
            background-color: #222;

            border: 2px solid #444;

            border-radius: 12px;

            padding: 10px 20px;

            min-width: 120px;
        }

        .score-box p {
            margin: 5px;
            font-size: 18px;
        }

        #score {
            color: #35e51f;
            font-weight: bold;
        }

        #meilleurScore {
            color: #ffd700;
            font-weight: bold;
        }


        /* =========================
           BOUTONS
        ========================= */

        .boutons-jeu {
            display: flex;

            justify-content: center;

            align-items: center;

            gap: 10px;

            flex-wrap: wrap;

            margin-top: 15px;
        }

        .boutons-jeu button {
            font-size: 16px;

            padding: 12px 18px;

            border: none;

            border-radius: 10px;

            background-color: #007bff;

            color: white;

            cursor: pointer;

            transition: 0.2s;
        }

        .boutons-jeu button:hover {
            background-color: #00aaff;

            transform: scale(1.05);
        }


        /* =========================
           BOUTON REJOUER
        ========================= */

        #boutonRejouer {
            display: none;

            background-color: #28a745;
        }

        #boutonRejouer:hover {
            background-color: #35c957;
        }


        /* =========================
           ENREGISTREMENT SCORE
        ========================= */

        #zoneEnregistrement {
            display: none;

            max-width: 500px;

            margin: 25px auto;

            padding: 20px;

            background-color: #222;

            border: 2px solid #ffd700;

            border-radius: 15px;
        }

        #zoneEnregistrement h3 {
            color: #ffd700;
        }

        #enregistrerScore {
            background-color: #28a745;

            color: white;

            border: none;

            border-radius: 10px;

            padding: 12px 20px;

            font-size: 17px;

            cursor: pointer;
        }

        #enregistrerScore:hover {
            background-color: #35c957;
            transform: scale(1.05);
        }

        #messageEnregistrement {
            min-height: 25px;
            font-weight: bold;
        }


        /* =========================
           MESSAGE
        ========================= */

        #message {
            min-height: 25px;

            font-size: 20px;

            font-weight: bold;

            color: #ff4444;
        }


        /* =========================
           CLASSEMENT
        ========================= */

        .classement {
            max-width: 700px;

            margin: 40px auto;

            background-color: #111;

            color: white;

            padding: 25px;

            border-radius: 20px;

            border: 2px solid #35e51f;

            box-shadow:
                0 0 20px rgba(53, 229, 31, 0.2);

            box-sizing: border-box;
        }

        .classement h2 {
            color: #35e51f;

            margin-top: 0;

            font-size: 28px;
        }

        #tableauClassement {
            width: 100%;

            border-collapse: collapse;

            margin-top: 20px;
        }

        #tableauClassement th {
            background-color: #198f12;

            color: white;

            padding: 12px;

            text-align: center;
        }

        #tableauClassement td {
            padding: 12px;

            border-bottom: 1px solid #444;

            text-align: center;
        }

        #tableauClassement tr:hover {
            background-color: #222;
        }

        .message-classement {
            margin-top: 15px;

            font-size: 18px;
        }


        /* =========================
           CONTROLES
        ========================= */

        .controles-snake {
            display: flex;

            flex-direction: column;

            align-items: center;

            margin-top: 20px;

            user-select: none;
        }

        .ligne-controles {
            display: flex;

            justify-content: center;
        }

        .controles-snake button {
            width: 70px;

            height: 60px;

            margin: 5px;

            font-size: 28px;

            border: none;

            border-radius: 15px;

            background-color: #007bff;

            color: white;

            cursor: pointer;

            touch-action: manipulation;

            transition: 0.1s;
        }

        .controles-snake button:hover {
            background-color: #00aaff;
        }

        .controles-snake button:active {
            transform: scale(0.90);
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            nav {
                padding: 12px 5px;
            }

            nav a {
                font-size: 17px;
                margin: 0 8px;
            }

            .jeu-snake {
                width: 100%;
                margin: 15px auto;
                padding: 10px 5px;
            }

            .jeu-snake h2 {
                font-size: 25px;
            }

            #jeu {
                width: 85vw;
                max-width: 320px;
                border-width: 4px;
            }

            .controles-snake button {
                width: 65px;
                height: 55px;
                font-size: 26px;
                margin: 3px;
            }

            .classement {
                margin: 30px 5px;
                padding: 15px;
            }

            #tableauClassement th,
            #tableauClassement td {
                padding: 8px;
                font-size: 14px;
            }

        }

    </style>

</head>

    <!-- =========================
         JAVASCRIPT
    ========================= -->

    <script>


        /* =====================================================
           SUPABASE
        ===================================================== */

        const SUPABASE_URL =
            "https://pxgymcwpbesqyjochwgd.supabase.co";


        const SUPABASE_ANON_KEY =
            "sb_publishable_F0af00-z9ZDemm9ch1tIaA_wSNCZb9G";


        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_ANON_KEY
            );


        /* =====================================================
           IDENTIFICATION DU JEU
        ===================================================== */

        const JEU = "jeux4";


        /* =====================================================
           PSEUDO
        ===================================================== */

        const pseudo =
            localStorage.getItem(
                "pseudoGameZone"
            );


        if (pseudo) {

            document.getElementById(
                "pseudoJoueur"
            ).textContent =
                pseudo;


            document.getElementById(
                "pseudoAffiche"
            ).textContent =
                pseudo;

        }

        else {

            document.getElementById(
                "pseudoJoueur"
            ).textContent =
                "Aucun pseudo";


            document.getElementById(
                "pseudoAffiche"
            ).textContent =
                "Aucun pseudo";

        }


        /* =====================================================
           CANVAS
        ===================================================== */

        const canvas =
            document.getElementById("jeu");


        const contexte =
            canvas.getContext("2d");


        const tailleCase = 20;


        /* =====================================================
           VARIABLES SNAKE
        ===================================================== */

        let serpent = [

            { x: 200, y: 200 },

            { x: 180, y: 200 },

            { x: 160, y: 200 }

        ];


        let direction = "droite";


        let nourriture = {

            x: 300,

            y: 200

        };


        let score = 0;


        let meilleurScore =
            Number(
                localStorage.getItem(
                    "meilleurScoreSnake"
                )
            ) || 0;


        let jeuTermine = false;


        let jeuEnPause = false;


        let scoreEnregistre = false;


        /* =====================================================
           AFFICHER MEILLEUR SCORE
        ===================================================== */

        document.getElementById(
            "meilleurScore"
        ).textContent =
            meilleurScore;


        /* =====================================================
           CLAVIER
        ===================================================== */

        document.addEventListener(
            "keydown",
            changerDirection
        );


        function changerDirection(event) {

            const touche =
                event.key.toLowerCase();


            if (

                event.key === "ArrowUp" ||
                event.key === "ArrowDown" ||
                event.key === "ArrowLeft" ||
                event.key === "ArrowRight"

            ) {

                event.preventDefault();

            }


            if (

                (
                    touche === "z" ||
                    event.key === "ArrowUp"
                )

                &&

                direction !== "bas"

            ) {

                direction = "haut";

            }


            if (

                (
                    touche === "s" ||
                    event.key === "ArrowDown"
                )

                &&

                direction !== "haut"

            ) {

                direction = "bas";

            }


            if (

                (
                    touche === "q" ||
                    event.key === "ArrowLeft"
                )

                &&

                direction !== "droite"

            ) {

                direction = "gauche";

            }


            if (

                (
                    touche === "d" ||
                    event.key === "ArrowRight"
                )

                &&

                direction !== "gauche"

            ) {

                direction = "droite";

            }

        }


        /* =====================================================
           CONTROLES MOBILE
        ===================================================== */

        function changerDirectionTactile(
            nouvelleDirection
        ) {

            if (jeuTermine || jeuEnPause) {

                return;

            }


            if (

                nouvelleDirection === "haut" &&
                direction !== "bas"

            ) {

                direction = "haut";

            }


            if (

                nouvelleDirection === "bas" &&
                direction !== "haut"

            ) {

                direction = "bas";

            }


            if (

                nouvelleDirection === "gauche" &&
                direction !== "droite"

            ) {

                direction = "gauche";

            }


            if (

                nouvelleDirection === "droite" &&
                direction !== "gauche"

            ) {

                direction = "droite";

            }

        }


        /* =====================================================
           DESSIN
        ===================================================== */

        function dessiner() {

            contexte.clearRect(
                0,
                0,
                canvas.width,
                canvas.height
            );


            contexte.fillStyle =
                "#eeeeee";


            contexte.fillRect(
                0,
                0,
                canvas.width,
                canvas.height
            );


            /* =========================
               SERPENT
            ========================= */

            for (
                let i = 0;
                i < serpent.length;
                i++
            ) {

                contexte.fillStyle =
                    i === 0
                        ? "#0b8f00"
                        : "#21b51a";


                contexte.fillRect(

                    serpent[i].x,

                    serpent[i].y,

                    tailleCase - 1,

                    tailleCase - 1

                );

            }


            /* =========================
               NOURRITURE
            ========================= */

            contexte.fillStyle =
                "red";


            contexte.fillRect(

                nourriture.x,

                nourriture.y,

                tailleCase - 1,

                tailleCase - 1

            );

        }


        /* =====================================================
           AVANCER
        ===================================================== */

        function avancer() {

            if (

                jeuTermine ||
                jeuEnPause

            ) {

                return;

            }


            let tete = {

                x: serpent[0].x,

                y: serpent[0].y

            };


            /* =========================
               DIRECTION
            ========================= */

            if (direction === "droite") {

                tete.x += tailleCase;

            }


            if (direction === "gauche") {

                tete.x -= tailleCase;

            }


            if (direction === "haut") {

                tete.y -= tailleCase;

            }


            if (direction === "bas") {

                tete.y += tailleCase;

            }


            /* =========================
               TRAVERSER LES BORDS
            ========================= */

            if (tete.x < 0) {

                tete.x =
                    canvas.width - tailleCase;

            }


            if (tete.x >= canvas.width) {

                tete.x = 0;

            }


            if (tete.y < 0) {

                tete.y =
                    canvas.height - tailleCase;

            }


            if (tete.y >= canvas.height) {

                tete.y = 0;

            }


            serpent.unshift(tete);


            /* =========================
               MANGER
            ========================= */

            if (

                tete.x === nourriture.x &&
                tete.y === nourriture.y

            ) {

                score++;


                document.getElementById(
                    "score"
                ).textContent =
                    score;


                /* =========================
                   NOUVEAU RECORD LOCAL
                ========================= */

                if (score > meilleurScore) {

                    meilleurScore =
                        score;


                    document.getElementById(
                        "meilleurScore"
                    ).textContent =
                        meilleurScore;


                    localStorage.setItem(
                        "meilleurScoreSnake",
                        meilleurScore
                    );

                }


                nouvelleNourriture();

            }

            else {

                serpent.pop();

            }


            /* =========================
               COLLISION AVEC LE CORPS
            ========================= */

            for (

                let i = 1;

                i < serpent.length;

                i++

            ) {

                if (

                    tete.x === serpent[i].x &&
                    tete.y === serpent[i].y

                ) {

                    terminerJeu();

                    return;

                }

            }


            dessiner();

        }


        /* =====================================================
           NOURRITURE
        ===================================================== */

        function nouvelleNourriture() {

            let positionValide =
                false;


            while (!positionValide) {

                nourriture.x =
                    Math.floor(
                        Math.random() *
                        (canvas.width / tailleCase)
                    ) * tailleCase;


                nourriture.y =
                    Math.floor(
                        Math.random() *
                        (canvas.height / tailleCase)
                    ) * tailleCase;


                positionValide =
                    !serpent.some(
                        function(partie) {

                            return (

                                partie.x ===
                                nourriture.x

                                &&

                                partie.y ===
                                nourriture.y

                            );

                        }
                    );

            }

        }


        /* =====================================================
           GAME OVER
        ===================================================== */

        function terminerJeu() {

            jeuTermine = true;


            document.getElementById(
                "boutonPause"
            ).disabled = true;


            document.getElementById(
                "boutonRejouer"
            ).style.display =
                "inline-block";


            document.getElementById(
                "zoneEnregistrement"
            ).style.display =
                "block";


            document.getElementById(
                "scoreFinal"
            ).textContent =
                score;


            if (

                score === meilleurScore &&
                score > 0

            ) {

                document.getElementById(
                    "message"
                ).textContent =
                    "👑 NOUVEAU RECORD ! Score : "
                    + score;

            }

            else {

                document.getElementById(
                    "message"
                ).textContent =
                    "💀 Game Over ! Score : "
                    + score;

            }

        }


        /* =====================================================
           PAUSE
        ===================================================== */

        function pauseJeu() {

            if (jeuTermine) {

                return;

            }


            jeuEnPause =
                !jeuEnPause;


            const bouton =
                document.getElementById(
                    "boutonPause"
                );


            if (jeuEnPause) {

                bouton.textContent =
                    "▶️ Reprendre";


                document.getElementById(
                    "message"
                ).textContent =
                    "⏸️ Jeu en pause";

            }

            else {

                bouton.textContent =
                    "⏸️ Pause";


                document.getElementById(
                    "message"
                ).textContent =
                    "";

            }

        }


        /* =====================================================
           RECOMMENCER
        ===================================================== */

        function recommencer() {

            clearInterval(intervalle);


            serpent = [

                { x: 200, y: 200 },

                { x: 180, y: 200 },

                { x: 160, y: 200 }

            ];


            direction = "droite";


            score = 0;


            jeuTermine = false;


            jeuEnPause = false;


            scoreEnregistre = false;


            document.getElementById(
                "score"
            ).textContent =
                "0";


            document.getElementById(
                "message"
            ).textContent =
                "";


            document.getElementById(
                "boutonPause"
            ).textContent =
                "⏸️ Pause";


            document.getElementById(
                "boutonPause"
            ).disabled =
                false;


            document.getElementById(
                "boutonRejouer"
            ).style.display =
                "none";


            document.getElementById(
                "zoneEnregistrement"
            ).style.display =
                "none";


            document.getElementById(
                "messageEnregistrement"
            ).textContent =
                "";


            nouvelleNourriture();


            dessiner();


            intervalle =
                setInterval(
                    avancer,
                    120
                );

        }


        /* =====================================================
           REJOUER
        ===================================================== */

        function rejouer() {

            recommencer();

        }


        /* =====================================================
           ENREGISTRER LE MEILLEUR SCORE
        ===================================================== */

        async function enregistrerMeilleurScore() {

            const message =
                document.getElementById(
                    "messageEnregistrement"
                );


            const pseudoActuel =
                localStorage.getItem(
                    "pseudoGameZone"
                );


            /* =========================
               VÉRIFIER PSEUDO
            ========================= */

            if (!pseudoActuel) {

                message.textContent =
                    "❌ Aucun pseudo trouvé. Retourne à l'accueil.";

                return;

            }


            /* =========================
               VÉRIFIER SCORE
            ========================= */

            if (score <= 0) {

                message.textContent =
                    "⚠️ Ton score doit être supérieur à 0.";

                return;

            }


            /* =========================
               EMPÊCHER DOUBLE CLIC
            ========================= */

            if (scoreEnregistre) {

                message.textContent =
                    "ℹ️ Ce score a déjà été enregistré.";

                return;

            }


            scoreEnregistre = true;


            message.textContent =
                "⏳ Enregistrement...";


            try {

                /* =========================
                   CHERCHER LE SCORE EXISTANT
                ========================= */

                const {

                    data: ancienScore,

                    error: erreurRecherche

                } =

                    await supabaseClient

                        .from("scores")

                        .select(
                            "pseudo,score,jeu"
                        )

                        .eq(
                            "pseudo",
                            pseudoActuel
                        )

                        .eq(
                            "jeu",
                            JEU
                        )

                        .limit(1);


                if (erreurRecherche) {

                    console.error(
                        "Erreur recherche :",
                        erreurRecherche
                    );


                    scoreEnregistre =
                        false;


                    message.textContent =
                        "❌ Impossible de rechercher ton score.";

                    return;

                }


                /* =========================
                   SCORE EXISTANT
                ========================= */

                if (

                    ancienScore &&
                    ancienScore.length > 0

                ) {

                    const scoreExistant =
                        Number(
                            ancienScore[0].score
                        );


                    /* =========================
                       MEILLEUR SCORE
                    ========================= */

                    if (

                        score >
                        scoreExistant

                    ) {

                        const {

                            error: erreurUpdate

                        } =

                            await supabaseClient

                                .from("scores")

                                .update({

                                    score:
                                        score,

                                    date_creation:
                                        new Date()
                                            .toISOString()

                                })

                                .eq(
                                    "pseudo",
                                    pseudoActuel
                                )

                                .eq(
                                    "jeu",
                                    JEU
                                );


                        if (erreurUpdate) {

                            console.error(
                                "Erreur update :",
                                erreurUpdate
                            );


                            scoreEnregistre =
                                false;


                            message.textContent =
                                "❌ Impossible de mettre à jour le score.";

                            return;

                        }


                        message.textContent =
                            "🏆 Nouveau record enregistré !";

                    }

                    else {

                        message.textContent =
                            "ℹ️ Ton ancien score est meilleur ou égal.";

                    }

                }


                /* =========================
                   PREMIER SCORE
                ========================= */

                else {

                    const {

                        error: erreurInsertion

                    } =

                        await supabaseClient

                            .from("scores")

                            .insert({

                                pseudo:
                                    pseudoActuel,

                                score:
                                    score,

                                jeu:
                                    JEU,

                                date_creation:
                                    new Date()
                                        .toISOString()

                            });


                    if (erreurInsertion) {

                        console.error(
                            "Erreur insertion :",
                            erreurInsertion
                        );


                        scoreEnregistre =
                            false;


                        message.textContent =
                            "❌ Impossible d'enregistrer le score.";

                        return;

                    }


                    message.textContent =
                        "✅ Score enregistré !";

                }


                /* =========================
                   ACTUALISER CLASSEMENT
                ========================= */

                await chargerClassement();

            }

            catch (erreur) {

                console.error(
                    "Erreur :",
                    erreur
                );


                scoreEnregistre =
                    false;


                message.textContent =
                    "❌ Erreur lors de l'enregistrement.";

            }

        }


        /* =====================================================
           CHARGER CLASSEMENT
        ===================================================== */

        async function chargerClassement() {

            const tbody =
                document.getElementById(
                    "classementBody"
                );


            tbody.innerHTML = `

                <tr>

                    <td colspan="3">

                        ⏳ Chargement...

                    </td>

                </tr>

            `;


            try {

                const {

                    data,
                    error

                } =

                    await supabaseClient

                        .from("scores")

                        .select(
                            "pseudo,score,date_creation"
                        )

                        .eq(
                            "jeu",
                            JEU
                        )

                        .order(
                            "score",
                            {
                                ascending: false
                            }
                        )

                        .limit(10);


                if (error) {

                    console.error(
                        "Erreur classement :",
                        error
                    );


                    throw new Error(
                        "Classement impossible."
                    );

                }


                /* =========================
                   AUCUN SCORE
                ========================= */

                if (

                    !data ||
                    data.length === 0

                ) {

                    tbody.innerHTML = `

                        <tr>

                            <td colspan="3">

                                Aucun score pour Snake.

                            </td>

                        </tr>

                    `;

                    return;

                }


                /* =========================
                   AFFICHER
                ========================= */

                tbody.innerHTML = "";


                data.forEach(
                    function(
                        joueur,
                        index
                    ) {

                        const ligne =
                            document.createElement(
                                "tr"
                            );


                        const position =
                            document.createElement(
                                "td"
                            );


                        if (index === 0) {

                            position.textContent =
                                "🥇";

                        }

                        else if (index === 1) {

                            position.textContent =
                                "🥈";

                        }

                        else if (index === 2) {

                            position.textContent =
                                "🥉";

                        }

                        else {

                            position.textContent =
                                index + 1;

                        }


                        const pseudoCell =
                            document.createElement(
                                "td"
                            );


                        pseudoCell.textContent =
                            joueur.pseudo;


                        const scoreCell =
                            document.createElement(
                                "td"
                            );


                        scoreCell.textContent =
                            "🐍 " +
                            joueur.score;


                        ligne.appendChild(
                            position
                        );


                        ligne.appendChild(
                            pseudoCell
                        );


                        ligne.appendChild(
                            scoreCell
                        );


                        tbody.appendChild(
                            ligne
                        );

                    }
                );

            }

            catch (erreur) {

                console.error(
                    "Erreur :",
                    erreur
                );


                tbody.innerHTML = `

                    <tr>

                        <td colspan="3">

                            ❌ Impossible de charger le classement.

                        </td>

                    </tr>

                `;

            }

        }


        /* =====================================================
           LANCEMENT
        ===================================================== */

        dessiner();


        let intervalle =
            setInterval(
                avancer,
                120
            );


        /* =====================================================
           CLASSEMENT AU CHARGEMENT
        ===================================================== */

        chargerClassement();

    </script>
