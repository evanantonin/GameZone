<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>GameZone - Snake</title>

    <link rel="stylesheet" href="style.css">

    <!-- SUPABASE -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>


<body class="page-jeu">


<script>

/* =====================================================
   PROTECTION DU JEU
   Si aucun compte n'est connecté,
   retour automatique à l'accueil.
===================================================== */

if (!localStorage.getItem("pseudoGameZone")) {

    window.location.href = "index.html";

}

</script>


<!-- =====================================================
     MENU
===================================================== -->

<nav>

    <a href="index.html">
        🏠 Accueil
    </a>

    <a href="liste-jeux.html">
        🎮 Jeux
    </a>

</nav>


<!-- =====================================================
     JEU
===================================================== -->

<main class="page-jeu-snake">


    <h1>
        🐍 Snake
    </h1>


    <a
        href="liste-jeux.html"
        class="retour-jeux">

        ⬅️ Retour aux jeux

    </a>


    <!-- =================================================
         PSEUDO
    ================================================= -->

    <p>

        👤 Joueur :

        <strong id="pseudoJoueur">
            Chargement...
        </strong>

    </p>


    <!-- =================================================
         SCORES
    ================================================= -->

    <div class="scores-snake">

        <p>

            🎯 Score :

            <strong>
                <span id="score">0</span>
            </strong>

        </p>


        <p>

            🏆 Meilleur score :

            <strong>
                <span id="meilleurScore">0</span>
            </strong>

        </p>

    </div>


    <!-- =================================================
         CANVAS
    ================================================= -->

    <canvas
        id="jeu"
        width="400"
        height="400">

    </canvas>


    <p id="messageSnake"></p>


    <!-- =================================================
         BOUTONS
    ================================================= -->

    <div class="boutons-snake">

        <button
            id="boutonPause"
            onclick="pauseJeu()">

            ⏸️ Pause

        </button>


        <button
            onclick="recommencer()">

            🔄 Recommencer

        </button>

    </div>


    <!-- =================================================
         CONTRÔLES MOBILE
    ================================================= -->

    <div class="controles-snake">


        <button
            onclick="changerDirection('haut')">

            ⬆️

        </button>


        <div>

            <button
                onclick="changerDirection('gauche')">

                ⬅️

            </button>


            <button
                onclick="changerDirection('bas')">

                ⬇️

            </button>


            <button
                onclick="changerDirection('droite')">

                ➡️

            </button>

        </div>


    </div>


    <!-- =================================================
         ENREGISTREMENT
    ================================================= -->

    <div
        id="zoneEnregistrement"
        style="display:none;">

        <h2>
            🏆 Enregistrer ton score
        </h2>


        <p>

            👤 Pseudo :

            <strong id="pseudoAffiche"></strong>

        </p>


        <button
            id="enregistrerScore"
            onclick="enregistrerMeilleurScore()">

            💾 Enregistrer le score

        </button>


        <p id="messageEnregistrement"></p>

    </div>


    <!-- =================================================
         CLASSEMENT
    ================================================= -->

    <section class="classement">

        <h2>
            🌍 🏆 TOP 10 MONDIAL - SNAKE
        </h2>


        <table id="tableauClassement">

            <thead>

                <tr>

                    <th>
                        #
                    </th>

                    <th>
                        👤 Pseudo
                    </th>

                    <th>
                        🎯 Score
                    </th>

                </tr>

            </thead>


            <tbody id="classementBody">

                <tr>

                    <td colspan="3">
                        ⏳ Chargement...
                    </td>

                </tr>

            </tbody>

        </table>


        <p
            id="messageClassement"
            class="message-classement">

        </p>


    </section>


</main>


<script src="script4.js"></script>

</body>

</html>
