
<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>GameZone - Pierre Feuille Ciseaux</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        /* =========================
           PAGE
        ========================= */

        .page-pfc {
            text-align: center;
            padding: 30px 15px;
        }

        .page-pfc h1 {
            color: #ff9800;
            font-size: 42px;
        }

        /* =========================
           JEU
        ========================= */

        .jeu-pfc {
            max-width: 700px;
            margin: 20px auto;

            background: white;

            border: 2px solid #ff9800;

            padding: 30px;

            border-radius: 20px;

            box-shadow:
                0 0 20px rgba(255, 152, 0, 0.2);
        }

        .jeu-pfc h2 {
            color: #ff9800;
            font-size: 30px;
        }

        /* =========================
           BOUTONS
        ========================= */

        .boutons-pfc {
            margin: 25px 0;
        }

        .boutons-pfc button,
        #boutonRejouer {
            margin: 6px;

            padding: 14px 20px;

            border: none;

            border-radius: 12px;

            background: #ff9800;

            color: white;

            font-size: 18px;

            cursor: pointer;

            transition: 0.2s;
        }

        .boutons-pfc button:hover,
        #boutonRejouer:hover {
            background: #ffb52e;
            transform: scale(1.05);
        }

        .boutons-pfc button:disabled {
            background: #999;
            cursor: not-allowed;
            transform: none;
        }

        /* =========================
           BOUTON REJOUER
        ========================= */

        #boutonRejouer {
            background: #28a745;

            display: none;

            margin-top: 20px;
        }

        #boutonRejouer:hover {
            background: #35c957;
        }

        /* =========================
           CHOIX
        ========================= */

        .choix {
            font-size: 20px;
            margin: 10px;
        }

        /* =========================
           SCORE
        ========================= */

        .score {
            font-size: 22px;
            font-weight: bold;
            margin: 25px;
        }

        .score p {
            margin: 8px;
        }

        /* =========================
           RESULTAT
        ========================= */

        #resultat {
            font-size: 25px;

            font-weight: bold;

            color: #ff9800;

            min-height: 35px;
        }

        /* =========================
           HISTORIQUE
        ========================= */

        .historique-container {
            margin-top: 25px;

            text-align: left;

            background: #f2f2f2;

            padding: 15px;

            border-radius: 12px;
        }

        .historique-container h3 {
            color: #ff9800;
            text-align: center;
        }

        #historique {
            color: #222;
            padding-left: 25px;
        }

        #historique li {
            margin: 6px 0;
        }

        /* =========================
           CLASSEMENT
        ========================= */

        .classement {
            max-width: 700px;

            margin: 30px auto;

            background: white;

            border: 2px solid #ff9800;

            border-radius: 20px;

            padding: 20px;

            color: #222;
        }

        .classement h2 {
            color: #ff9800;

            text-align: center;

            margin-top: 0;
        }

        .classement table {
            width: 100%;

            border-collapse: collapse;

            margin-top: 15px;
        }

        .classement th,
        .classement td {
            padding: 10px;

            border-bottom: 1px solid #ddd;

            text-align: center;
        }

        .classement th {
            color: #ff9800;
        }

        .classement tr:hover {
            background-color: #f5f5f5;
        }

        #messageClassement {
            margin-top: 15px;

            font-weight: bold;

            min-height: 25px;
        }

        /* =========================
           PSEUDO CONNECTÉ
        ========================= */

        .pseudo-connecte {
            margin: 15px auto;

            padding: 12px;

            max-width: 400px;

            background: #fff3cd;

            border: 1px solid #ff9800;

            border-radius: 10px;

            font-size: 18px;
        }

        /* =========================
           RETOUR
        ========================= */

        .retour-jeux {
            display: inline-block;

            margin-bottom: 15px;

            background: #333;

            color: white;

            padding: 10px 18px;

            border-radius: 10px;

            text-decoration: none;

            font-size: 16px;
        }

        .retour-jeux:hover {
            background: #555;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            .page-pfc {
                padding: 20px 8px;
            }

            .page-pfc h1 {
                font-size: 32px;
            }

            .jeu-pfc {
                padding: 20px 10px;
            }

            .jeu-pfc h2 {
                font-size: 25px;
            }

            .boutons-pfc button {
                width: 90%;
                font-size: 17px;
                padding: 14px;
            }

            .score {
                font-size: 20px;
            }

            #resultat {
                font-size: 21px;
            }

            .classement {
                padding: 10px;
            }

            .classement th,
            .classement td {
                padding: 7px;
                font-size: 14px;
            }

        }

    </style>

</head>


<body class="page-jeu">


    <!-- =========================
         MENU
    ========================= -->

    <nav>

        <a href="index.html">
            🏠 Accueil
        </a>

        <a href="liste-jeux.html">
            🎮 Jeux
        </a>

    </nav>


    <!-- =========================
         PAGE
    ========================= -->

    <main class="page-pfc">

        <h1>
            ✂️ Pierre Feuille Ciseaux
        </h1>


        <a
            href="liste-jeux.html"
            class="retour-jeux">

            ⬅️ Retour aux jeux

        </a>


        <!-- =========================
             PSEUDO
        ========================= -->

        <div
            class="pseudo-connecte"
            id="pseudoConnecte">

            👤 Chargement du pseudo...

        </div>


        <!-- =========================
             JEU
        ========================= -->

        <div class="jeu-pfc">

            <h2>
                Premier à 5 gagne 🏆
            </h2>


            <!-- BOUTONS -->

            <div class="boutons-pfc">

                <button
                    id="boutonPierre"
                    onclick="jouer('pierre')">

                    🪨 Pierre

                </button>


                <button
                    id="boutonFeuille"
                    onclick="jouer('feuille')">

                    📄 Feuille

                </button>


                <button
                    id="boutonCiseaux"
                    onclick="jouer('ciseaux')">

                    ✂️ Ciseaux

                </button>

            </div>


            <!-- CHOIX -->

            <p
                id="choixJoueur"
                class="choix">

                🧑 Toi : -

            </p>


            <p
                id="choixOrdinateur"
                class="choix">

                🤖 Ordinateur : -

            </p>


            <!-- SCORE -->

            <div class="score">

                <p>

                    🧑 Toi :
                    <span id="scoreJoueur">0</span>

                </p>


                <p>

                    🤖 Ordinateur :
                    <span id="scoreOrdinateur">0</span>

                </p>

            </div>


            <!-- RESULTAT -->

            <p id="resultat"></p>


            <!-- REJOUER -->

            <button
                id="boutonRejouer"
                onclick="rejouer()">

                🔄 Rejouer

            </button>


            <!-- HISTORIQUE -->

            <div class="historique-container">

                <h3>
                    📜 Historique
                </h3>

                <ul id="historique"></ul>

            </div>

        </div>


        <!-- =========================
             CLASSEMENT
        ========================= -->

        <div class="classement">

            <h2>
                🌍 🏆 TOP 10 MONDIAL
            </h2>

            <p>
                ✂️ Pierre Feuille Ciseaux
            </p>


            <table>

                <thead>

                    <tr>

                        <th>#</th>

                        <th>👤 Pseudo</th>

                        <th>🏆 Victoires</th>

                        <th>📅 Date</th>

                    </tr>

                </thead>


                <tbody id="tableauClassement">

                    <tr>

                        <td colspan="4">
                            Chargement...
                        </td>

                    </tr>

                </tbody>

            </table>


            <p id="messageClassement"></p>

        </div>


    </main>


    <script>

        /* ==================================================
           SUPABASE
        ================================================== */

        const SUPABASE_URL =
            "https://pxgymcwpbesqyjochwgd.supabase.co";

        const SUPABASE_ANON_KEY =
            "sb_publishable_F0af00-z9ZDemm9ch1tIaA_wSNCZb9G";


        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_ANON_KEY
            );


        /* ==================================================
           IDENTIFIANT DU JEU
        ================================================== */

        const JEU = "jeux3";


        /* ==================================================
           PSEUDO DU JOUEUR
        ================================================== */

        const pseudo =
    localStorage.getItem("pseudoGameZone");

        if (pseudo) {

            document.getElementById(
                "pseudoConnecte"
            ).textContent =
                "👤 Joueur : " + pseudo;

        }

        else {

            document.getElementById(
                "pseudoConnecte"
            ).textContent =
                "❌ Aucun pseudo trouvé sur le site.";

        }


        /* ==================================================
           VARIABLES
        ================================================== */

        let scoreJoueur = 0;

        let scoreOrdinateur = 0;

        let partieTerminee = false;


        /* ==================================================
           BOUTONS
        ================================================== */

        function activerBoutons() {

            document.getElementById(
                "boutonPierre"
            ).disabled = false;

            document.getElementById(
                "boutonFeuille"
            ).disabled = false;

            document.getElementById(
                "boutonCiseaux"
            ).disabled = false;

        }


        function desactiverBoutons() {

            document.getElementById(
                "boutonPierre"
            ).disabled = true;

            document.getElementById(
                "boutonFeuille"
            ).disabled = true;

            document.getElementById(
                "boutonCiseaux"
            ).disabled = true;

        }


        /* ==================================================
           JOUER
        ================================================== */

        function jouer(choixJoueur) {


            if (partieTerminee) {

                return;

            }


            const choix = [
                "pierre",
                "feuille",
                "ciseaux"
            ];


            const choixOrdinateur =
                choix[
                    Math.floor(
                        Math.random() * 3
                    )
                ];


            const emojis = {

                pierre: "🪨 Pierre",

                feuille: "📄 Feuille",

                ciseaux: "✂️ Ciseaux"

            };


            document.getElementById(
                "choixJoueur"
            ).textContent =
                "🧑 Toi : " +
                emojis[choixJoueur];


            document.getElementById(
                "choixOrdinateur"
            ).textContent =
                "🤖 Ordinateur : " +
                emojis[choixOrdinateur];


            let resultat;


            /* =========================
               EGALITE
            ========================= */

            if (
                choixJoueur === choixOrdinateur
            ) {

                resultat =
                    "🤝 Égalité !";

            }


            /* =========================
               JOUEUR GAGNE
            ========================= */

            else if (

                (
                    choixJoueur === "pierre" &&
                    choixOrdinateur === "ciseaux"
                )

                ||

                (
                    choixJoueur === "feuille" &&
                    choixOrdinateur === "pierre"
                )

                ||

                (
                    choixJoueur === "ciseaux" &&
                    choixOrdinateur === "feuille"
                )

            ) {

                scoreJoueur++;

                resultat =
                    "🎉 Tu as gagné la manche !";

            }


            /* =========================
               ORDINATEUR GAGNE
            ========================= */

            else {

                scoreOrdinateur++;

                resultat =
                    "😢 Tu as perdu la manche !";

            }


            /* =========================
               AFFICHER SCORE
            ========================= */

            document.getElementById(
                "scoreJoueur"
            ).textContent =
                scoreJoueur;


            document.getElementById(
                "scoreOrdinateur"
            ).textContent =
                scoreOrdinateur;


            document.getElementById(
                "resultat"
            ).textContent =
                resultat;


            /* =========================
               HISTORIQUE
            ========================= */

            const ligne =
                document.createElement("li");


            ligne.textContent =
                emojis[choixJoueur]
                + " vs "
                + emojis[choixOrdinateur]
                + " → "
                + resultat;


            document.getElementById(
                "historique"
            ).appendChild(ligne);


            /* =========================
               VICTOIRE
            ========================= */

            if (scoreJoueur >= 5) {

                terminerPartie(
                    true
                );

            }

            else if (
                scoreOrdinateur >= 5
            ) {

                terminerPartie(
                    false
                );

            }

        }


        /* ==================================================
           TERMINER PARTIE
        ================================================== */

        async function terminerPartie(
            victoire
        ) {

            partieTerminee = true;

            desactiverBoutons();


            if (victoire) {

                document.getElementById(
                    "resultat"
                ).textContent =
                    "🏆 TU AS GAGNÉ LA PARTIE !";


                await enregistrerVictoire();

            }

            else {

                document.getElementById(
                    "resultat"
                ).textContent =
                    "🤖 L'ORDINATEUR A GAGNÉ !";

            }


            document.getElementById(
                "boutonRejouer"
            ).style.display =
                "inline-block";

        }


        /* ==================================================
           ENREGISTRER LA VICTOIRE
        ================================================== */

        async function enregistrerVictoire() {


            if (!pseudo) {

                document.getElementById(
                    "messageClassement"
                ).textContent =
                    "❌ Aucun pseudo trouvé sur le site.";

                return;

            }


            document.getElementById(
                "messageClassement"
            ).textContent =
                "⏳ Enregistrement de la victoire...";


            try {

                /*
                 * On cherche si le joueur possède
                 * déjà une ligne pour jeux3.
                 */

                const {
                    data,
                    error
                } =
                    await supabaseClient

                        .from("scores")

                        .select(
                            "pseudo,score,jeu"
                        )

                        .eq(
                            "pseudo",
                            pseudo
                        )

                        .eq(
                            "jeu",
                            JEU
                        )
                        .limit(1);


                if (error) {

                    console.error(
                        "Erreur recherche :",
                        error
                    );

                    document.getElementById(
                        "messageClassement"
                    ).textContent =
                        "❌ Impossible de récupérer ton score.";

                    return;

                }


                /* =========================
                   SCORE EXISTANT
                ========================= */

                if (
                    data &&
                    data.length > 0
                ) {

                    const nouveauScore =
                        Number(
                            data[0].score
                        ) + 1;


                    const {
                        error:
                            erreurUpdate
                    } =
                        await supabaseClient

                            .from("scores")

                            .update({

                                score:
                                    nouveauScore,

                                date_creation:
                                    new Date()
                                        .toISOString()

                            })

                            .eq(
                                "pseudo",
                                pseudo
                            )

                            .eq(
                                "jeu",
                                JEU
                            );


                    if (erreurUpdate) {

                        console.error(
                            "Erreur update :",
                            erreurUpdate
                        );

                        document.getElementById(
                            "messageClassement"
                        ).textContent =
                            "❌ Erreur lors de l'enregistrement.";

                        return;

                    }

                }


                /* =========================
                   PREMIÈRE VICTOIRE
                ========================= */

                else {

                    const {
                        error:
                            erreurInsert
                    } =
                        await supabaseClient

                            .from("scores")

                            .insert({

                                pseudo:
                                    pseudo,

                                score:
                                    1,

                                jeu:
                                    JEU,

                                date_creation:
                                    new Date()
                                        .toISOString()

                            });


                    if (erreurInsert) {

                        console.error(
                            "Erreur insertion :",
                            erreurInsert
                        );

                        document.getElementById(
                            "messageClassement"
                        ).textContent =
                            "❌ Erreur lors de l'enregistrement.";

                        return;

                    }

                }


                document.getElementById(
                    "messageClassement"
                ).textContent =
                    "✅ Victoire enregistrée !";


                chargerClassement();

            }

            catch (erreur) {

                console.error(
                    "Erreur :",
                    erreur
                );

                document.getElementById(
                    "messageClassement"
                ).textContent =
                    "❌ Erreur lors de l'enregistrement.";

            }

        }


        /* ==================================================
           REJOUER
        ================================================== */

        function rejouer() {


            scoreJoueur = 0;

            scoreOrdinateur = 0;

            partieTerminee = false;


            document.getElementById(
                "scoreJoueur"
            ).textContent =
                "0";


            document.getElementById(
                "scoreOrdinateur"
            ).textContent =
                "0";


            document.getElementById(
                "choixJoueur"
            ).textContent =
                "🧑 Toi : -";


            document.getElementById(
                "choixOrdinateur"
            ).textContent =
                "🤖 Ordinateur : -";


            document.getElementById(
                "resultat"
            ).textContent =
                "";


            document.getElementById(
                "historique"
            ).innerHTML =
                "";


            document.getElementById(
                "boutonRejouer"
            ).style.display =
                "none";


            document.getElementById(
                "messageClassement"
            ).textContent =
                "";


            activerBoutons();

        }


        /* ==================================================
           CLASSEMENT
        ================================================== */

        async function chargerClassement() {


            const tableau =
                document.getElementById(
                    "tableauClassement"
                );


            tableau.innerHTML = `
                <tr>
                    <td colspan="4">
                        ⏳ Chargement...
                    </td>
                </tr>
            `;


            try {

                const {
                    data,
                    error
                } =
                    await supabaseClient

                        .from("scores")

                        .select(
                            "pseudo,score,date_creation"
                        )

                        .eq(
                            "jeu",
                            JEU
                        )

                        .order(
                            "score",
                            {
                                ascending: false
                            }
                        )

                        .limit(10);


                if (error) {

                    console.error(
                        "Erreur classement :",
                        error
                    );

                    tableau.innerHTML = `
                        <tr>
                            <td colspan="4">
                                ❌ Impossible de charger le classement.
                            </td>
                        </tr>
                    `;

                    return;

                }


                if (
                    !data ||
                    data.length === 0
                ) {

                    tableau.innerHTML = `
                        <tr>
                            <td colspan="4">
                                Aucun score pour Pierre Feuille Ciseaux.
                            </td>
                        </tr>
                    `;

                    return;

                }


                tableau.innerHTML = "";


                data.forEach(
                    function (
                        joueur,
                        index
                    ) {

                        const ligne =
                            document.createElement(
                                "tr"
                            );


                        const position =
                            document.createElement(
                                "td"
                            );


                        if (index === 0) {

                            position.textContent =
                                "🥇";

                        }

                        else if (index === 1) {

                            position.textContent =
                                "🥈";

                        }

                        else if (index === 2) {

                            position.textContent =
                                "🥉";

                        }

                        else {

                            position.textContent =
                                index + 1;

                        }


                        const pseudoCell =
                            document.createElement(
                                "td"
                            );


                        pseudoCell.textContent =
                            joueur.pseudo;


                        const scoreCell =
                            document.createElement(
                                "td"
                            );


                        scoreCell.textContent =
                            "🏆 " +
                            joueur.score;


                        const dateCell =
                            document.createElement(
                                "td"
                            );


                        if (
                            joueur.date_creation
                        ) {

                            dateCell.textContent =
                                new Date(
                                    joueur.date_creation
                                ).toLocaleDateString(
                                    "fr-FR"
                                );

                        }

                        else {

                            dateCell.textContent =
                                "—";

                        }


                        ligne.appendChild(
                            position
                        );

                        ligne.appendChild(
                            pseudoCell
                        );

                        ligne.appendChild(
                            scoreCell
                        );

                        ligne.appendChild(
                            dateCell
                        );


                        tableau.appendChild(
                            ligne
                        );

                    }
                );

            }

            catch (erreur) {

                console.error(
                    "Erreur classement :",
                    erreur
                );

                tableau.innerHTML = `
                    <tr>
                        <td colspan="4">
                            ❌ Impossible de charger le classement.
                        </td>
                    </tr>
                `;

            }

        }


        /* ==================================================
           CHARGEMENT INITIAL
        ================================================== */

        chargerClassement();

    </script>

</body>

</html>
