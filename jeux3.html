<!DOCTYPE html>

<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>GameZone - Pierre Feuille Ciseaux</title>

    <link rel="stylesheet" href="style.css">

    <style>

        /* =========================
           PAGE PIERRE FEUILLE CISEAUX
        ========================= */

        .page-pfc {
            text-align: center;
            padding: 30px 15px;
        }


        .page-pfc h1 {
            color: #ff9800;
            font-size: 42px;
        }


        /* =========================
           CASE DU JEU
        ========================= */

        .jeu-pfc {
            max-width: 700px;
            margin: 20px auto;

            background: #222;

            border: 2px solid #ff9800;

            padding: 30px;

            border-radius: 20px;

            box-shadow:
                0 0 20px rgba(255, 152, 0, 0.3);
        }


        .jeu-pfc h2 {
            color: #ff9800;
            font-size: 30px;
        }


        /* =========================
           BOUTONS DU JEU
        ========================= */

        .boutons-pfc {
            margin: 25px 0;
        }


        .boutons-pfc button {
            margin: 6px;

            padding: 14px 20px;

            border: none;

            border-radius: 12px;

            background: #ff9800;

            color: white;

            font-size: 18px;

            cursor: pointer;

            transition: 0.2s;
        }


        .boutons-pfc button:hover {
            background: #ffb52e;

            transform: scale(1.05);
        }


        /* =========================
           CHOIX
        ========================= */

        .choix {
            font-size: 20px;

            margin: 10px;
        }


        /* =========================
           SCORE
        ========================= */

        .score {
            font-size: 22px;

            font-weight: bold;

            margin: 25px;
        }


        .score p {
            margin: 8px;
        }


        /* =========================
           RESULTAT
        ========================= */

        #resultat {
            font-size: 25px;

            font-weight: bold;

            color: #ffd166;

            min-height: 35px;
        }


        /* =========================
           HISTORIQUE
        ========================= */

        .historique-container {
            margin-top: 25px;

            text-align: left;

            background: #111;

            padding: 15px;

            border-radius: 12px;
        }


        .historique-container h3 {
            color: #ff9800;

            text-align: center;
        }


        #historique {
            color: white;

            padding-left: 25px;
        }


        #historique li {
            margin: 6px 0;
        }


        /* =========================
           RETOUR AUX JEUX
        ========================= */

        .retour-jeux {
            display: inline-block;

            margin-bottom: 15px;

            background: #333;

            color: white;

            padding: 10px 18px;

            border-radius: 10px;

            text-decoration: none;

            font-size: 16px;
        }


        .retour-jeux:hover {
            background: #555;

            transform: scale(1.05);
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            .page-pfc {
                padding: 20px 8px;
            }


            .page-pfc h1 {
                font-size: 32px;
            }


            .jeu-pfc {
                padding: 20px 10px;
            }


            .jeu-pfc h2 {
                font-size: 25px;
            }


            .boutons-pfc button {
                width: 90%;

                font-size: 17px;

                padding: 14px;
            }


            .score {
                font-size: 20px;
            }


            #resultat {
                font-size: 21px;
            }

        }

    </style>

</head>


<body class="page-jeu">


    <!-- =========================
         MENU
    ========================= -->

    <nav>

        <a href="index.html">
            🏠 Accueil
        </a>

        <a href="liste-jeux.html">
            🎮 Jeux
        </a>

    </nav>


    <!-- =========================
         PAGE DU JEU
    ========================= -->

    <main class="page-pfc">


        <h1>
            ✂️ Pierre Feuille Ciseaux
        </h1>


        <!-- RETOUR -->

        <a
            href="liste-jeux.html"
            class="retour-jeux">

            ⬅️ Retour aux jeux

        </a>


        <!-- =========================
             JEU
        ========================= -->

        <div class="jeu-pfc">


            <h2>
                Pierre 🪨
                Feuille 📄
                Ciseaux ✂️
            </h2>


            <!-- BOUTONS -->

            <div class="boutons-pfc">

                <button
                    onclick="jouer('pierre')">

                    🪨 Pierre

                </button>


                <button
                    onclick="jouer('feuille')">

                    📄 Feuille

                </button>


                <button
                    onclick="jouer('ciseaux')">

                    ✂️ Ciseaux

                </button>

            </div>


            <!-- CHOIX -->

            <p
                id="choixJoueur"
                class="choix">

                🧑 Toi : -

            </p>


            <p
                id="choixOrdinateur"
                class="choix">

                🤖 Ordinateur : -

            </p>


            <!-- SCORE -->

            <div class="score">

                <p>

                    🧑 Toi :
                    <span id="scoreJoueur">
                        0
                    </span>

                </p>


                <p>

                    🤖 Ordinateur :
                    <span id="scoreOrdinateur">
                        0
                    </span>

                </p>

            </div>


            <!-- RESET -->

            <button
                onclick="resetScore()">

                🔄 Réinitialiser le score

            </button>


            <!-- RESULTAT -->

            <p id="resultat"></p>


            <!-- HISTORIQUE -->

            <div class="historique-container">

                <h3>
                    📜 Historique
                </h3>


                <ul id="historique"></ul>

            </div>


        </div>

    </main>


    <script>


        /* =========================
           SCORES
        ========================= */

        let scoreJoueur = 0;

        let scoreOrdinateur = 0;

        let partieTerminee = false;


        /* =========================
           JOUER
        ========================= */

        function jouer(choixJoueur) {


            /* Empêcher de jouer
               après la victoire */

            if (partieTerminee) {

                return;

            }


            /* Choix possibles */

            let choix = [

                "pierre",
                "feuille",
                "ciseaux"

            ];


            /* Choix ordinateur */

            let choixOrdinateur =
                choix[
                    Math.floor(
                        Math.random() * 3
                    )
                ];


            /* Emojis */

            let emojis = {

                pierre: "🪨 Pierre",

                feuille: "📄 Feuille",

                ciseaux: "✂️ Ciseaux"

            };


            /* Afficher choix joueur */

            document.getElementById(
                "choixJoueur"
            ).textContent =

                "🧑 Toi : "
                + emojis[choixJoueur];


            /* Afficher choix ordinateur */

            document.getElementById(
                "choixOrdinateur"
            ).textContent =

                "🤖 Ordinateur : "
                + emojis[choixOrdinateur];


            let resultat = "";


            /* =========================
               EGALITE
            ========================= */

            if (
                choixJoueur ===
                choixOrdinateur
            ) {

                resultat =
                    "🤝 Égalité !";

            }


            /* =========================
               JOUEUR GAGNE
            ========================= */

            else if (

                (
                    choixJoueur === "pierre"
                    &&
                    choixOrdinateur === "ciseaux"
                )

                ||

                (
                    choixJoueur === "feuille"
                    &&
                    choixOrdinateur === "pierre"
                )

                ||

                (
                    choixJoueur === "ciseaux"
                    &&
                    choixOrdinateur === "feuille"
                )

            ) {

                resultat =
                    "🎉 Tu as gagné !";

                scoreJoueur++;

            }


            /* =========================
               ORDINATEUR GAGNE
            ========================= */

            else {

                resultat =
                    "😢 Tu as perdu !";

                scoreOrdinateur++;

            }


            /* =========================
               SCORES
            ========================= */

            document.getElementById(
                "scoreJoueur"
            ).textContent =
                scoreJoueur;


            document.getElementById(
                "scoreOrdinateur"
            ).textContent =
                scoreOrdinateur;


            /* =========================
               RESULTAT
            ========================= */

            document.getElementById(
                "resultat"
            ).textContent =
                resultat;


            /* =========================
               HISTORIQUE
            ========================= */

            let ligne =
                document.createElement("li");


            ligne.textContent =

                emojis[choixJoueur]
                + " vs "
                + emojis[choixOrdinateur]
                + " → "
                + resultat;


            document.getElementById(
                "historique"
            ).appendChild(ligne);


            /* =========================
               PREMIER A 5
            ========================= */

            if (
                scoreJoueur === 5
            ) {

                document.getElementById(
                    "resultat"
                ).textContent =

                    "🏆 TU AS GAGNÉ LA PARTIE ! 🏆";


                partieTerminee = true;

            }


            else if (
                scoreOrdinateur === 5
            ) {

                document.getElementById(
                    "resultat"
                ).textContent =

                    "🤖 L'ORDINATEUR A GAGNÉ LA PARTIE !";


                partieTerminee = true;

            }

        }


        /* =========================
           RESET
        ========================= */

        function resetScore() {


            scoreJoueur = 0;

            scoreOrdinateur = 0;

            partieTerminee = false;


            /* Scores */

            document.getElementById(
                "scoreJoueur"
            ).textContent = "0";


            document.getElementById(
                "scoreOrdinateur"
            ).textContent = "0";


            /* Résultat */

            document.getElementById(
                "resultat"
            ).textContent = "";


            /* Choix */

            document.getElementById(
                "choixJoueur"
            ).textContent =
                "🧑 Toi : -";


            document.getElementById(
                "choixOrdinateur"
            ).textContent =
                "🤖 Ordinateur : -";


            /* Historique */

            document.getElementById(
                "historique"
            ).innerHTML = "";

        }

    </script>


</body>

</html>
