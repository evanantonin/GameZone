<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>GameZone - Jeu de clics</title>

    <link rel="stylesheet" href="style.css">

    <!-- SUPABASE -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    

</head>


<body class="page-jeu">
    <script>
    if (!localStorage.getItem("pseudoGameZone")) {
        window.location.href = "index.html";
    }
</script>


    <!-- =========================
         MENU
    ========================= -->

    <nav>

        <a href="index.html">
            🏠 Accueil
        </a>

        <a href="liste-jeux.html">
            🎮 Jeux
        </a>

    </nav>


    <!-- =========================
         JEU
    ========================= -->

    <main class="page-clics">

        <h1>
            🎯 Jeu de clics
        </h1>


        <a
            href="liste-jeux.html"
            class="retour-jeux">

            ⬅️ Retour aux jeux

        </a>


        <!-- =========================
             PSEUDO
        ========================= -->

        <p>
            👤 Joueur :
            <strong id="pseudoJoueur">
                Chargement...
            </strong>
        </p>


        <!-- =========================
             INFORMATIONS
        ========================= -->

        <div class="infos-jeu">

            <p>
                Score :
                <strong>
                    <span id="score">0</span>
                </strong>
            </p>

            <p>
                🏆 Meilleur score :
                <strong>
                    <span id="meilleurScore">0</span>
                </strong>
            </p>

            <p>
                ⏱️ Temps :
                <strong>
                    <span id="temps">30</span>
                </strong>
                secondes
            </p>

        </div>


        <!-- =========================
             BOUTON
        ========================= -->

        <button
            id="boutonJeu"
            onclick="ajouterPoint()">

            CLIQUEZ ! 👆

        </button>


        <br>


        <!-- =========================
             REJOUER
        ========================= -->

        <button
            id="rejouer"
            onclick="rejouer()"
            style="display:none;">

            Rejouer 🔄

        </button>


        <!-- =========================
             ENREGISTRER SCORE
        ========================= -->

        <div id="zoneEnregistrement">

            <h2>
                🏆 Enregistrer ton score
            </h2>

            <p>
                👤 Pseudo :
                <strong id="pseudoAffiche"></strong>
            </p>

            <button
                id="enregistrerScore"
                onclick="enregistrerMeilleurScore()">

                💾 Enregistrer le score

            </button>

            <p id="messageEnregistrement"></p>

        </div>


        <!-- =========================
             CLASSEMENT
        ========================= -->

        <section class="classement">

            <h2>
                🌍 🏆 TOP 10 MONDIAL - JEU DE CLICS
            </h2>

            <table id="tableauClassement">

                <thead>

                    <tr>

                        <th>#</th>

                        <th>👤 Pseudo</th>

                        <th>🎯 Score</th>

                    </tr>

                </thead>

                <tbody id="classementBody">

                    <tr>

                        <td colspan="3">
                            ⏳ Chargement...
                        </td>

                    </tr>

                </tbody>

            </table>

            <p
                id="messageClassement"
                class="message-classement">
            </p>

        </section>

    </main>


    <script>

        /* =====================================================
           SUPABASE
        ===================================================== */

        const SUPABASE_URL =
            "https://pxgymcwpbesqyjochwgd.supabase.co";

        const SUPABASE_ANON_KEY =
            "sb_publishable_F0af00-z9ZDemm9ch1tIaA_wSNCZb9G";

        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_ANON_KEY
            );


        /* =====================================================
           IDENTIFICATION DU JEU
        ===================================================== */

        const JEU = "jeux";


        /* =====================================================
           PSEUDO
        ===================================================== */

        const pseudo =
            localStorage.getItem(
                "pseudoGameZone"
            );


        /* =====================================================
           VARIABLES DU JEU
        ===================================================== */

        let score = 0;

        let meilleurScore =
            Number(
                localStorage.getItem(
                    "meilleurScore"
                )
            ) || 0;

        let temps = 30;

        let chrono = null;

        let jeuTermine = false;

        let scoreEnregistre = false;


        /* =====================================================
           VÉRIFIER LE PSEUDO
        ===================================================== */

        if (!pseudo) {

            document.getElementById(
                "pseudoJoueur"
            ).textContent =
                "Aucun pseudo";

            document.getElementById(
                "pseudoAffiche"
            ).textContent =
                "Aucun pseudo";

        }

        else {

            document.getElementById(
                "pseudoJoueur"
            ).textContent =
                pseudo;

            document.getElementById(
                "pseudoAffiche"
            ).textContent =
                pseudo;

        }


        /* =====================================================
           MEILLEUR SCORE LOCAL
        ===================================================== */

        document.getElementById(
            "meilleurScore"
        ).textContent =
            meilleurScore;


        /* =====================================================
           AJOUTER UN POINT
        ===================================================== */

        function ajouterPoint() {

            if (jeuTermine) {
                return;
            }

            score++;

            document.getElementById(
                "score"
            ).textContent =
                score;


            if (score > meilleurScore) {

                meilleurScore = score;

                document.getElementById(
                    "meilleurScore"
                ).textContent =
                    meilleurScore;

                localStorage.setItem(
                    "meilleurScore",
                    meilleurScore
                );

            }

        }


        /* =====================================================
           CHRONOMÈTRE
        ===================================================== */

        function demarrerChrono() {

            clearInterval(chrono);

            chrono =
                setInterval(
                    function() {

                        temps--;

                        document.getElementById(
                            "temps"
                        ).textContent =
                            temps;


                        if (temps <= 0) {

                            clearInterval(chrono);

                            jeuTermine = true;


                            document.getElementById(
                                "boutonJeu"
                            ).disabled = true;


                            document.getElementById(
                                "rejouer"
                            ).style.display =
                                "inline-block";


                            document.getElementById(
                                "zoneEnregistrement"
                            ).style.display =
                                "block";


                            document.getElementById(
                                "messageEnregistrement"
                            ).textContent =
                                "";


                            alert(
                                "⏱️ Temps écoulé !\n\n" +
                                "Ton score : " +
                                score
                            );

                        }

                    },
                    1000
                );

        }


        /* =====================================================
           REJOUER
        ===================================================== */

        function rejouer() {

            clearInterval(chrono);

            score = 0;

            temps = 30;

            jeuTermine = false;

            scoreEnregistre = false;


            document.getElementById(
                "score"
            ).textContent =
                "0";


            document.getElementById(
                "temps"
            ).textContent =
                "30";


            document.getElementById(
                "boutonJeu"
            ).disabled =
                false;


            document.getElementById(
                "rejouer"
            ).style.display =
                "none";


            document.getElementById(
                "zoneEnregistrement"
            ).style.display =
                "none";


            document.getElementById(
                "messageEnregistrement"
            ).textContent =
                "";


            demarrerChrono();

        }


        /* =====================================================
           ENREGISTRER LE SCORE
        ===================================================== */

        async function enregistrerMeilleurScore() {

            const message =
                document.getElementById(
                    "messageEnregistrement"
                );


            /* =========================
               PSEUDO
            ========================= */

            const pseudoActuel =
                localStorage.getItem(
                    "pseudoGameZone"
                );


            if (!pseudoActuel) {

                message.textContent =
                    "❌ Aucun pseudo trouvé. Retourne à l'accueil.";

                return;

            }


            /* =========================
               SCORE
            ========================= */

            if (score <= 0) {

                message.textContent =
                    "⚠️ Ton score doit être supérieur à 0.";

                return;

            }


            /* =========================
               EMPÊCHER DOUBLE CLIC
            ========================= */

            if (scoreEnregistre) {

                message.textContent =
                    "ℹ️ Ce score a déjà été enregistré.";

                return;

            }


            scoreEnregistre = true;

            message.textContent =
                "⏳ Enregistrement...";


            try {

                /* =================================================
                   CHERCHER LE SCORE DU JOUEUR POUR CE JEU
                ================================================= */

                const {
                    data: ancienScore,
                    error: erreurRecherche
                } =
                    await supabaseClient

                        .from("scores")

                        .select(
                            "pseudo,score,jeu"
                        )

                        .eq(
                            "pseudo",
                            pseudoActuel
                        )

                        .eq(
                            "jeu",
                            JEU
                        )

                        .limit(1);


                if (erreurRecherche) {

                    console.error(
                        "Erreur recherche :",
                        erreurRecherche
                    );

                    scoreEnregistre = false;

                    throw new Error(
                        "Recherche impossible."
                    );

                }


                /* =================================================
                   SCORE EXISTANT
                ================================================= */

                if (
                    ancienScore &&
                    ancienScore.length > 0
                ) {

                    const scoreExistant =
                        Number(
                            ancienScore[0].score
                        );


                    /* =========================
                       NOUVEAU RECORD
                    ========================= */

                    if (
                        score > scoreExistant
                    ) {

                        const {
                            error: erreurUpdate
                        } =
                            await supabaseClient

                                .from("scores")

                                .update({

                                    score:
                                        score,

                                    date_creation:
                                        new Date()
                                            .toISOString()

                                })

                                .eq(
                                    "pseudo",
                                    pseudoActuel
                                )

                                .eq(
                                    "jeu",
                                    JEU
                                );


                        if (erreurUpdate) {

                            console.error(
                                "Erreur update :",
                                erreurUpdate
                            );

                            scoreEnregistre = false;

                            throw new Error(
                                "Modification impossible."
                            );

                        }


                        message.textContent =
                            "🏆 Nouveau record enregistré !";

                    }

                    else {

                        message.textContent =
                            "ℹ️ Ton ancien score est meilleur ou égal.";

                    }

                }


                /* =================================================
                   PREMIER SCORE
                ================================================= */

                else {

                    const {
                        error: erreurInsertion
                    } =
                        await supabaseClient

                            .from("scores")

                            .insert({

                                pseudo:
                                    pseudoActuel,

                                score:
                                    score,

                                jeu:
                                    JEU,

                                date_creation:
                                    new Date()
                                        .toISOString()

                            });


                    if (erreurInsertion) {

                        console.error(
                            "Erreur insertion :",
                            erreurInsertion
                        );

                        scoreEnregistre = false;

                        throw new Error(
                            "Insertion Supabase impossible."
                        );

                    }


                    message.textContent =
                        "✅ Score enregistré !";

                }


                /* =================================================
                   ACTUALISER LE CLASSEMENT
                ================================================= */

                await chargerClassement();

            }

            catch (erreur) {

                console.error(
                    "Erreur :",
                    erreur
                );

                scoreEnregistre = false;

                message.textContent =
                    "❌ Erreur lors de l'enregistrement.";

            }

        }


        /* =====================================================
           CHARGER LE CLASSEMENT
        ===================================================== */

        async function chargerClassement() {

            const tbody =
                document.getElementById(
                    "classementBody"
                );


            tbody.innerHTML = `

                <tr>

                    <td colspan="3">

                        ⏳ Chargement...

                    </td>

                </tr>

            `;


            try {

                const {
                    data,
                    error
                } =
                    await supabaseClient

                        .from("scores")

                        .select(
                            "pseudo,score,date_creation"
                        )

                        /* IMPORTANT :
                           uniquement le jeu de clics */

                        .eq(
                            "jeu",
                            JEU
                        )

                        .order(
                            "score",
                            {
                                ascending: false
                            }
                        )

                        .limit(10);


                if (error) {

                    console.error(
                        "Erreur classement :",
                        error
                    );

                    throw new Error(
                        "Classement impossible."
                    );

                }


                /* =========================
                   AUCUN SCORE
                ========================= */

                if (
                    !data ||
                    data.length === 0
                ) {

                    tbody.innerHTML = `

                        <tr>

                            <td colspan="3">

                                Aucun score pour ce jeu.

                            </td>

                        </tr>

                    `;

                    return;

                }


                /* =========================
                   AFFICHER LES SCORES
                ========================= */

                tbody.innerHTML = "";


                data.forEach(
                    function(joueur, index) {

                        const ligne =
                            document.createElement(
                                "tr"
                            );


                        const position =
                            document.createElement(
                                "td"
                            );


                        if (index === 0) {

                            position.textContent =
                                "🥇";

                        }

                        else if (index === 1) {

                            position.textContent =
                                "🥈";

                        }

                        else if (index === 2) {

                            position.textContent =
                                "🥉";

                        }

                        else {

                            position.textContent =
                                index + 1;

                        }


                        const pseudoCell =
                            document.createElement(
                                "td"
                            );


                        pseudoCell.textContent =
                            joueur.pseudo;


                        const scoreCell =
                            document.createElement(
                                "td"
                            );


                        scoreCell.textContent =
                            joueur.score;


                        ligne.appendChild(
                            position
                        );

                        ligne.appendChild(
                            pseudoCell
                        );

                        ligne.appendChild(
                            scoreCell
                        );


                        tbody.appendChild(
                            ligne
                        );

                    }
                );

            }

            catch (erreur) {

                console.error(
                    "Erreur classement :",
                    erreur
                );


                tbody.innerHTML = `

                    <tr>

                        <td colspan="3">

                            ❌ Impossible de charger le classement.

                        </td>

                    </tr>

                `;

            }

        }


        /* =====================================================
           DÉMARRAGE
        ===================================================== */

        demarrerChrono();


        /* =====================================================
           CHARGER LE CLASSEMENT
        ===================================================== */

        chargerClassement();

    </script>

</body>

</html>
