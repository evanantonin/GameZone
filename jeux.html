<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>GameZone - Jeu de clics</title>

    <link rel="stylesheet" href="style.css">

    <!-- SUPABASE -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>


<body class="page-jeu">


<!-- =====================================================
     AUTHENTIFICATION
===================================================== -->

<script>

    const SUPABASE_URL =
        "https://pxgymcwpbesqyjochwgd.supabase.co";

    const SUPABASE_ANON_KEY =
        "sb_publishable_F0af00-z9ZDemm9ch1tIaA_wSNCZb9G";

    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_ANON_KEY
        );


    /*
     =====================================================
     VÉRIFICATION DU COMPTE
     =====================================================
    */

    async function verifierConnexion() {

        const {
            data,
            error
        } = await supabaseClient.auth.getSession();


        if (error) {

            console.error(
                "Erreur authentification :",
                error
            );

            window.location.href =
                "index.html";

            return;

        }


        /*
         Si aucune session :
         retour à l'accueil
        */

        if (!data.session) {

            window.location.href =
                "index.html";

            return;

        }

    }


    verifierConnexion();

</script>


<!-- =====================================================
     MENU
===================================================== -->

<nav>

    <a href="index.html">
        🏠 Accueil
    </a>

    <a href="liste-jeux.html">
        🎮 Jeux
    </a>

</nav>


<!-- =====================================================
     JEU
===================================================== -->

<main class="page-clics">


    <h1>
        🎯 Jeu de clics
    </h1>


    <a
        href="liste-jeux.html"
        class="retour-jeux">

        ⬅️ Retour aux jeux

    </a>


    <!-- =================================================
         PSEUDO
    ================================================== -->

    <p>

        👤 Joueur :

        <strong id="pseudoJoueur">
            Chargement...
        </strong>

    </p>


    <!-- =================================================
         INFORMATIONS
    ================================================== -->

    <div class="infos-jeu">

        <p>

            🎯 Score :

            <strong>
                <span id="score">
                    0
                </span>
            </strong>

        </p>


        <p>

            🏆 Meilleur score :

            <strong>
                <span id="meilleurScore">
                    0
                </span>
            </strong>

        </p>


        <p>

            ⏱️ Temps :

            <strong>
                <span id="temps">
                    30
                </span>
            </strong>

            secondes

        </p>

    </div>


    <!-- =================================================
         BOUTON DE JEU
    ================================================== -->

    <button
        id="boutonJeu"
        onclick="ajouterPoint()">

        CLIQUEZ ! 👆

    </button>


    <br>


    <!-- =================================================
         REJOUER
    ================================================== -->

    <button
        id="rejouer"
        onclick="rejouer()"
        style="display:none;">

        🔄 Rejouer

    </button>


    <!-- =================================================
         ENREGISTREMENT
    ================================================== -->

    <div
        id="zoneEnregistrement"
        style="display:none;">

        <h2>
            🏆 Enregistrer ton score
        </h2>


        <p>

            👤 Pseudo :

            <strong id="pseudoAffiche">
            </strong>

        </p>


        <button
            id="enregistrerScore"
            onclick="enregistrerMeilleurScore()">

            💾 Enregistrer le score

        </button>


        <p id="messageEnregistrement"></p>

    </div>


    <!-- =================================================
         CLASSEMENT
    ================================================== -->

    <section class="classement">


        <h2>
            🌍 🏆 TOP 10 MONDIAL
            <br>
            🎯 JEU DE CLICS
        </h2>


        <table id="tableauClassement">


            <thead>

                <tr>

                    <th>
                        #
                    </th>

                    <th>
                        👤 Pseudo
                    </th>

                    <th>
                        🎯 Score
                    </th>

                </tr>

            </thead>


            <tbody id="classementBody">

                <tr>

                    <td colspan="3">
                        ⏳ Chargement...
                    </td>

                </tr>

            </tbody>


        </table>


        <p
            id="messageClassement"
            class="message-classement">
        </p>


    </section>


</main>


<script src="script1.js"></script>

</body>

</html>
