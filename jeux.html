<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>GameZone - Jeu de clics</title>

    <link rel="stylesheet" href="style.css">

    <!-- SUPABASE -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>


<body class="page-jeu">


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- =====================================================
     MENU
===================================================== -->

<nav>

    <a href="index.html">
        🏠 Accueil
    </a>

    <a href="liste-jeux.html">
        🎮 Jeux
    </a>

    <a
        href="compte.html"
        class="icone-compte"
        title="Mon compte">

        👤

    </a>

</nav>


<!-- =====================================================
     JEU DE CLICS
===================================================== -->

<main class="page-clics">


    <!-- =================================================
         TITRE
    ================================================== -->

    <h1>

        🎯 Jeu de clics

    </h1>


    <!-- =================================================
         RETOUR
    ================================================== -->

    <a
        href="liste-jeux.html"
        class="retour-jeux">

        ⬅️ Retour aux jeux

    </a>


    <!-- =================================================
         PSEUDO
    ================================================== -->

    <p>

        👤 Joueur :

        <strong id="pseudoJoueur">

            Chargement...

        </strong>

    </p>


    <!-- =================================================
         INFORMATIONS
    ================================================== -->

    <div class="infos-jeu">


        <p>

            🎯 Score :

            <strong>

                <span id="score">

                    0

                </span>

            </strong>

        </p>


        <p>

            🏆 Meilleur score :

            <strong>

                <span id="meilleurScore">

                    0

                </span>

            </strong>

        </p>


        <p>

            ⏱️ Temps :

            <strong>

                <span id="temps">

                    30

                </span>

            </strong>

            secondes

        </p>


    </div>


    <!-- =================================================
         BOUTON PRINCIPAL
    ================================================== -->

    <button
        id="boutonJeu"
        onclick="ajouterPoint()">

        CLIQUEZ ! 👆

    </button>


    <br>


    <!-- =================================================
         BOUTON REJOUER
    ================================================== -->

    <button
        id="rejouer"
        onclick="rejouer()"
        style="display:none;">

        🔄 Rejouer

    </button>


    <!-- =================================================
         ENREGISTREMENT DU SCORE
    ================================================== -->

    <div
        id="zoneEnregistrement"
        style="display:none;">


        <h2>

            🏆 Enregistrer ton score

        </h2>


        <p>

            👤 Pseudo :

            <strong id="pseudoAffiche">

            </strong>

        </p>


        <button
            id="enregistrerScore"
            onclick="enregistrerMeilleurScore()">

            💾 Enregistrer le score

        </button>


        <p
            id="messageEnregistrement">

        </p>


    </div>


    <!-- =================================================
         CLASSEMENT
    ================================================== -->

    <section class="classement">


        <h2>

            🌍 🏆 TOP 10 MONDIAL

            <br>

            🎯 JEU DE CLICS

        </h2>


        <table id="tableauClassement">


            <thead>

                <tr>

                    <th>

                        #

                    </th>


                    <th>

                        👤 Pseudo

                    </th>


                    <th>

                        🎯 Score

                    </th>

                </tr>

            </thead>


            <tbody id="classementBody">


                <tr>

                    <td colspan="3">

                        ⏳ Chargement...

                    </td>

                </tr>


            </tbody>


        </table>


        <p
            id="messageClassement"
            class="message-classement">

        </p>


    </section>


</main>


<script src="script1.js"></script>



<!-- =====================================================
     VERIFICATION DE LA CONNEXION
===================================================== -->


</body>

</html>
