<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>GameZone - Jeu de clics</title>

    <link rel="stylesheet" href="style.css">

    <style>

        /* =========================
           JEU DE CLICS
        ========================= */

        .page-clics {
            text-align: center;
            padding: 30px 15px;
        }

        .page-clics h1 {
            color: #00aaff;
            font-size: 45px;
        }

        .infos-jeu {
            font-size: 20px;
            margin: 15px;
        }

        /* GROS BOUTON CLIQUER */

        #boutonJeu {
            background-color: #007bff;
            color: white;

            border: none;
            border-radius: 20px;

            padding: 30px 60px;

            font-size: 30px;
            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
        }

        #boutonJeu:hover {
            background-color: #00aaff;
            transform: scale(1.05);
        }

        #boutonJeu:active {
            transform: scale(0.95);
        }

        #boutonJeu:disabled {
            background-color: #555;
            cursor: not-allowed;
            transform: none;
        }

        /* BOUTON REJOUER */

        #rejouer {
            background-color: #28a745;
            color: white;

            border: none;
            border-radius: 12px;

            padding: 15px 25px;

            font-size: 18px;

            cursor: pointer;

            margin-top: 20px;
        }

        #rejouer:hover {
            background-color: #35c957;
            transform: scale(1.05);
        }

        /* RETOUR */

        .retour-jeux {
            display: inline-block;

            margin-bottom: 20px;

            background-color: #333;
            color: white;

            padding: 10px 18px;

            border-radius: 10px;

            text-decoration: none;

            font-size: 16px;
        }

        .retour-jeux:hover {
            background-color: #555;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            .page-clics {
                padding: 20px 10px;
            }

            .page-clics h1 {
                font-size: 32px;
            }

            .infos-jeu {
                font-size: 18px;
            }

            #boutonJeu {
                width: 90%;
                max-width: 350px;

                height: 120px;

                font-size: 28px;
            }

        }

    </style>

</head>


<body class="page-jeu">


    <!-- =========================
         MENU
    ========================= -->

    <nav>

        <a href="index.html">
            🏠 Accueil
        </a>

        <a href="liste-jeux.html">
            🎮 Jeux
        </a>

    </nav>


    <!-- =========================
         JEU
    ========================= -->

    <main class="page-clics">

        <h1>
            🎯 Jeu de clics
        </h1>


        <!-- RETOUR -->

        <a
            href="liste-jeux.html"
            class="retour-jeux">

            ⬅️ Retour aux jeux

        </a>


        <!-- INFORMATIONS -->

        <div class="infos-jeu">

            <p>
                Score :
                <strong>
                    <span id="score">0</span>
                </strong>
            </p>

            <p>
                🏆 Meilleur score :
                <strong>
                    <span id="meilleurScore">0</span>
                </strong>
            </p>

            <p>
                ⏱️ Temps :
                <strong>
                    <span id="temps">30</span>
                </strong>
                secondes
            </p>

        </div>


        <!-- BOUTON -->

        <button
            id="boutonJeu"
            onclick="ajouterPoint()">

            CLIQUEZ ! 👆

        </button>


        <!-- REJOUER -->

        <br>

        <button
            id="rejouer"
            onclick="rejouer()"
            style="display: none;">

            Rejouer 🔄

        </button>


    </main>


    <script>

        /* =========================
           VARIABLES
        ========================= */

        let score = 0;

        let meilleurScore =
            Number(
                localStorage.getItem("meilleurScore")
            ) || 0;

        let temps = 30;

        let chrono;


        /* =========================
           AFFICHER MEILLEUR SCORE
        ========================= */

        document.getElementById(
            "meilleurScore"
        ).textContent = meilleurScore;


        /* =========================
           AJOUTER UN POINT
        ========================= */

        function ajouterPoint() {

            score++;

            document.getElementById(
                "score"
            ).textContent = score;


            /* Meilleur score */

            if (score > meilleurScore) {

                meilleurScore = score;

                document.getElementById(
                    "meilleurScore"
                ).textContent = meilleurScore;


                localStorage.setItem(
                    "meilleurScore",
                    meilleurScore
                );

            }

        }


        /* =========================
           CHRONO
        ========================= */

        function demarrerChrono() {

            chrono = setInterval(function () {

                temps--;

                document.getElementById(
                    "temps"
                ).textContent = temps;


                if (temps <= 0) {

                    clearInterval(chrono);


                    document.getElementById(
                        "boutonJeu"
                    ).disabled = true;


                    document.getElementById(
                        "rejouer"
                    ).style.display =
                        "inline-block";


                    alert(
                        "⏱️ Temps écoulé !\n\n" +
                        "Ton score : " +
                        score
                    );

                }

            }, 1000);

        }


        /* =========================
           REJOUER
        ========================= */

        function rejouer() {

            clearInterval(chrono);


            score = 0;

            temps = 30;


            document.getElementById(
                "score"
            ).textContent = score;


            document.getElementById(
                "temps"
            ).textContent = temps;


            document.getElementById(
                "boutonJeu"
            ).disabled = false;


            document.getElementById(
                "rejouer"
            ).style.display = "none";


            demarrerChrono();

        }


        /* =========================
           DEMARRER LE JEU
        ========================= */

        demarrerChrono();

    </script>


</body>

</html>
