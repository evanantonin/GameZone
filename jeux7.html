<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>GameZone - Flappy</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;
        }

        body {

            background:
                radial-gradient(
                    circle at top,
                    #172554 0%,
                    #080b18 45%,
                    #02030a 100%
                );

            color: white;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            text-align: center;

            overflow-x: hidden;
        }


        /* =========================
           MENU
        ========================= */

        nav {

            width: 100%;

            padding: 16px 20px;

            display: flex;

            justify-content: center;

            align-items: center;

            gap: 20px;

            background:
                rgba(3, 5, 15, 0.95);

            border-bottom:
                2px solid #00ffff;

            box-shadow:
                0 0 15px
                rgba(0,255,255,0.25);
        }

        nav a {

            color: white;

            text-decoration: none;

            padding: 9px 16px;

            border:
                1px solid transparent;

            border-radius: 10px;

            font-size: 17px;

            font-weight: bold;

            transition: 0.2s;
        }

        nav a:hover {

            color: #00ffff;

            border-color: #00ffff;

            background:
                rgba(0,255,255,0.08);

            box-shadow:
                0 0 12px
                rgba(0,255,255,0.35);
        }


        /* =========================
           PAGE
        ========================= */

        .page-jeu {

            width: 95%;

            max-width: 900px;

            margin: 25px auto;

            display: flex;

            flex-direction: column;

            align-items: center;

            padding: 20px;

            background:
                linear-gradient(
                    145deg,
                    rgba(20,25,50,0.96),
                    rgba(5,7,18,0.96)
                );

            border:
                2px solid #26345c;

            border-radius: 24px;

            box-shadow:
                0 15px 45px
                rgba(0,0,0,0.7),

                inset 0 0 25px
                rgba(0,255,255,0.04);
        }


        /* =========================
           TITRE
        ========================= */

        h1 {

            margin: 5px auto 12px;

            color: #00ffff;

            font-size:
                clamp(40px,7vw,65px);

            letter-spacing: 4px;

            text-shadow:
                0 0 5px #00ffff,
                0 0 15px #00ffff,
                0 0 30px
                rgba(0,255,255,0.8);
        }

        .description {

            margin: 0 0 15px;

            color: #aeb8d0;

            font-size: 16px;
        }


        /* =========================
           JOUEUR
        ========================= */

        .joueur {

            margin-bottom: 15px;

            padding: 9px 18px;

            background:
                rgba(5,8,20,0.95);

            border:
                2px solid #00ffff;

            border-radius: 12px;

            color: #aaa;

            font-weight: bold;
        }

        .joueur span {

            color: #00ffff;

            font-size: 19px;
        }


        /* =========================
           INFOS
        ========================= */

        .infos {

            display: flex;

            justify-content: center;

            align-items: center;

            gap: 12px;

            margin: 10px auto 15px;

            flex-wrap: wrap;
        }

        .info {

            min-width: 125px;

            padding: 9px 16px;

            background:
                rgba(5,8,20,0.95);

            border:
                2px solid #00ffff;

            border-radius: 12px;

            color: #aaa;

            font-size: 15px;

            font-weight: bold;

            box-shadow:
                0 0 10px
                rgba(0,255,255,0.12);
        }

        .info span {

            color: #00ffff;

            font-size: 22px;

            font-weight: bold;
        }


        /* =========================
           JEU
        ========================= */

        .zone-jeu {

            position: relative;

            width: 600px;

            max-width: 100%;

            margin: 5px auto 15px;

            border-radius: 18px;

            overflow: hidden;

            background: #020617;

            border:
                4px solid #00ffff;

            box-shadow:
                0 0 10px #00ffff,
                0 0 25px
                rgba(0,255,255,0.35),
                0 15px 35px
                rgba(0,0,0,0.7);
        }

        #jeuFlappy {

            display: block;

            width: 600px;

            height: 400px;

            max-width: 100%;

            background:
                linear-gradient(
                    to bottom,
                    #38bdf8 0%,
                    #60a5fa 45%,
                    #bfdbfe 100%
                );

            cursor: pointer;

            user-select: none;

            -webkit-user-select: none;

            touch-action: none;
        }


        /* =========================
           MESSAGE
        ========================= */

        #message {

            width: 90%;

            max-width: 600px;

            margin: 10px auto 15px;

            padding: 12px 18px;

            background:
                rgba(5,8,20,0.95);

            border:
                2px solid #444;

            border-radius: 12px;

            color: white;

            font-weight: bold;
        }


        /* =========================
           BOUTONS
        ========================= */

        .boutons {

            display: flex;

            justify-content: center;

            align-items: center;

            gap: 12px;

            margin: 10px auto 15px;

            flex-wrap: wrap;
        }

        button,
        .retour {

            padding: 11px 22px;

            border:
                2px solid #00ffff;

            border-radius: 11px;

            background: #00ffff;

            color: #000;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            text-decoration: none;

            transition: 0.15s;
        }

        button:hover,
        .retour:hover {

            background: transparent;

            color: #00ffff;

            box-shadow:
                0 0 15px
                rgba(0,255,255,0.6);

            transform:
                translateY(-2px);
        }

        button:active {

            transform: scale(0.95);
        }


        /* =========================
           COMMANDES
        ========================= */

        .commandes {

            margin: 5px auto 10px;

            color: #8f9bb5;

            font-size: 14px;
        }


        /* =========================
           CONTROLES MOBILE
        ========================= */

        .controles-mobile {

            display: none;
        }


        /* =========================
           CLASSEMENT
        ========================= */

        .classement {

            width: 600px;

            max-width: 100%;

            margin: 20px auto 5px;

            padding: 18px;

            background:
                rgba(7,10,25,0.95);

            border:
                2px solid #29375e;

            border-radius: 18px;
        }

        .classement h2 {

            margin: 0 0 15px;

            color: #00ffff;

            text-shadow:
                0 0 8px
                rgba(0,255,255,0.5);
        }

        table {

            width: 100%;

            border-collapse: collapse;
        }

        th {

            padding: 10px;

            background: #00ffff;

            color: #000;
        }

        td {

            padding: 10px;

            background: #0c1022;

            color: white;

            border-bottom:
                1px solid #252b43;
        }

        tr:last-child td {

            border-bottom: none;
        }

        .mon-score {

            color: #00ffff;

            font-weight: bold;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 768px) {

            nav {

                gap: 8px;

                padding: 12px 8px;
            }

            nav a {

                font-size: 14px;

                padding: 8px 10px;
            }

            .page-jeu {

                width: 96%;

                margin: 15px auto;

                padding: 12px;

                border-radius: 18px;

                padding-bottom: 105px;
            }

            h1 {

                font-size: 38px;

                letter-spacing: 2px;
            }

            .description {

                font-size: 14px;
            }

            .infos {

                width: 100%;

                gap: 6px;
            }

            .info {

                min-width: 100px;

                padding: 7px 9px;

                font-size: 12px;
            }

            .info span {

                font-size: 18px;
            }

            .zone-jeu {

                width: 100%;

                height: 250px;

                border-width: 3px;

                border-radius: 12px;
            }

            #jeuFlappy {

                width: 100%;

                height: 250px;

                max-width: none;
            }


            /* CONTROLES FIXES */

            .controles-mobile {

                position: fixed;

                left: 0;

                right: 0;

                bottom: 15px;

                width: 100%;

                display: flex;

                justify-content: center;

                align-items: center;

                z-index: 99999;

                pointer-events: none;

                padding: 0 15px;
            }

            .controles-mobile button {

                width: 75px;

                height: 65px;

                padding: 0;

                display: flex;

                justify-content: center;

                align-items: center;

                font-size: 28px;

                border-radius: 15px;

                pointer-events: auto;

                touch-action: manipulation;

                box-shadow:
                    0 0 15px
                    rgba(0,255,255,0.5);
            }

            .classement {

                padding: 12px;
            }

        }

    </style>

</head>


<body>


    <nav>

        <a href="index.html">
            Accueil
        </a>

        <a href="liste-jeux.html">
            Jeux
        </a>

    </nav>


    <main class="page-jeu">


        <h1>🐦 FLAPPY</h1>


        <p class="description">
            Clique pour faire sauter l'oiseau !
        </p>


        <!-- PSEUDO -->

        <div class="joueur">

            👤 Joueur :

            <span id="pseudoJoueur">
                Chargement...
            </span>

        </div>


        <!-- INFOS -->

        <div class="infos">

            <div class="info">

                Score :

                <span id="score">
                    0
                </span>

            </div>


            <div class="info">

                Meilleur :

                <span id="meilleurScore">
                    0
                </span>

            </div>


            <div class="info">

                Niveau :

                <span id="niveau">
                    1
                </span>

            </div>

        </div>


        <!-- JEU -->

        <div class="zone-jeu">

            <canvas
                id="jeuFlappy"
                width="600"
                height="400">
            </canvas>

        </div>


        <p id="message">
            Clique pour commencer !
        </p>


        <div class="boutons">

            <button id="boutonRejouer">
                🔄 Rejouer
            </button>


            <a
                href="liste-jeux.html"
                class="retour">

                ← Retour aux jeux

            </a>

        </div>


        <p class="commandes">
            🖱️ Ordinateur : clic gauche
        </p>


        <!-- CONTROLE MOBILE -->

        <div class="controles-mobile">

            <button id="boutonMobile">
                🐦
            </button>

        </div>


        <!-- CLASSEMENT -->

        <section class="classement">

            <h2>
                🏆 Classement mondial
            </h2>


            <table>

                <thead>

                    <tr>

                        <th>
                            Position
                        </th>

                        <th>
                            Pseudo
                        </th>

                        <th>
                            Score
                        </th>

                    </tr>

                </thead>


                <tbody id="tableauScores">

                    <tr>

                        <td colspan="3">
                            ⏳ Chargement du classement...
                        </td>

                    </tr>

                </tbody>

            </table>

        </section>


    </main>


    <!-- SUPABASE -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


  <script src="script7.js"></script>

</body>

</html>
